name: Practice Workshop UI
on:
  push:
    branches: [main, ui/practice-workshop]
    paths: ['js/practiceLab/**', 'practiceLab*.css', 'index.html', 'sw.js', 'tests/practice-workshop.test.js', 'tests/browser/practice_workshop.mjs', '.github/apply-practice-workshop.mjs', '.github/workflows/practice-workshop.yml']
permissions:
  contents: read
concurrency:
  group: practice-workshop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate reviewed presentation hooks once
        id: source
        run: |
          if [ -f .github/apply-practice-workshop.mjs ]; then
            test "$GITHUB_REF_NAME" = ui/practice-workshop
            node .github/apply-practice-workshop.mjs
            node --check js/practiceLab/practiceLabIdentity.js
            node --test tests/practice-workshop.test.js tests/practice-lab-identity.test.js
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add js/practiceLab/practiceLabIdentity.js index.html sw.js .github/apply-practice-workshop.mjs
            git commit -m 'feat(practice): integrate the precision workshop without changing session hosts'
            git push origin HEAD:ui/practice-workshop
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  core:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p browser-artifacts/workshop-core
          npm test > browser-artifacts/workshop-core/unit.log 2>&1
          node scripts/validatePracticeReleaseContent.mjs > browser-artifacts/workshop-core/content.json
          node scripts/auditPracticePrivacySecurity.mjs > browser-artifacts/workshop-core/security.json
          node scripts/testPracticeMigrations.mjs > browser-artifacts/workshop-core/migrations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-core
          path: browser-artifacts/workshop-core/
          retention-days: 7
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            width: 1280
            widths: '1440,768,390,320'
          - browser: firefox
            width: 1280
            widths: '1440,390'
          - browser: webkit
            width: 390
            widths: '390,320'
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
      PRACTICE_BROWSER: ${{ matrix.browser }}
      PRACTICE_BROWSERS: ${{ matrix.browser }}
      PRACTICE_WIDTH: ${{ matrix.width }}
      PRACTICE_WIDTHS: ${{ matrix.widths }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.57.0 axe-core@4.10.3
      - name: Workshop interaction accessibility and reflow
        run: node tests/browser/practice_workshop.mjs
      - name: Existing studio discovery and setup regression
        if: ${{ !cancelled() }}
        run: node tests/browser/practice_identity.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: workshop-ui-${{ matrix.browser }}
          path: |
            browser-artifacts/practice-workshop/
            browser-artifacts/practice-identity/
          retention-days: 7
      - name: Complete all fifteen public drills
        if: ${{ !cancelled() }}
        run: node tests/browser/practice_end_to_end.mjs
      - name: Assessment and protected protocols
        if: ${{ !cancelled() }}
        run: node tests/browser/practice_completion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-evidence-${{ matrix.browser }}
          path: browser-artifacts/
          retention-days: 7
  live:
    if: github.ref == 'refs/heads/main'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
      PRACTICE_URL: https://thiepn.dev/wordstrike/
      PRACTICE_BROWSER: chromium
      PRACTICE_WIDTHS: '1440,390'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.57.0 axe-core@4.10.3
      - name: Wait for matching production assets
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {setTimeout as wait} from 'node:timers/promises';
          const files=['sw.js','practiceLabWorkshop.css','js/practiceLab/practiceLabWorkshop.js','js/practiceLab/practiceLabIdentity.js'];
          const deadline=Date.now()+300000;
          for(;;){
            const ok=await Promise.all(files.map(async file=>{
              try{const r=await fetch(process.env.PRACTICE_URL+file+'?release='+process.env.GITHUB_SHA,{signal:AbortSignal.timeout(12000)});return r.ok&&(await r.text())===fs.readFileSync(file,'utf8');}catch{return false;}
            }));
            if(ok.every(Boolean))break;
            if(Date.now()>deadline)throw Error('Deployed assets did not match this release');
            await wait(10000);
          }
          JS
      - name: Verify the deployed public UI
        run: node tests/browser/practice_workshop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-production
          path: browser-artifacts/practice-workshop/
          retention-days: 7
