name: Practice UI Source Snapshot
on:
  push:
    branches: [ui/practice-workshop]
    paths: ['.github/workflows/practice-ui-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > /tmp/practice-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: practice-ui-source
          path: /tmp/practice-source.tar
          retention-days: 1
