name: PL13 Apply

on:
  push:
    branches: [codex/pl13-ability-estimator-uncertainty]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl13-ability-estimator-uncertainty
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply PL13 integration
        run: |
          node --check scripts/applyPl13Integration.mjs
          node scripts/applyPl13Integration.mjs
          node --check js/practiceLab/practiceAbilityConstants.js
          node --check js/practiceLab/practiceAbilityPolicy.js
          node --check js/practiceLab/practiceAbilityObservation.js
          node --check js/practiceLab/practiceAbilityEstimator.js
          node --check js/practiceLab/practiceAbilityComparison.js
          node --check js/practiceLab/practiceAbilityValidation.js
          git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/practiceLab
          git commit -m "PL13: integrate ability measurement and atomic persistence"
          git push origin HEAD:codex/pl13-ability-estimator-uncertainty
