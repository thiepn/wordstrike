name: PL28 closure source snapshot
on:
  push:
    branches: [codex/pl28-common-words-v1]
    paths: [.github/workflows/pl28-closure-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture tracked source only
        run: |
          mkdir -p closure-artifacts
          git rev-parse HEAD > closure-artifacts/head-sha.txt
          git archive --format=tar.gz HEAD > closure-artifacts/pl28-source.tar.gz
          git fetch --depth=1 origin main
          git rev-parse FETCH_HEAD > closure-artifacts/main-sha.txt
          git archive --format=tar.gz FETCH_HEAD > closure-artifacts/main-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pl28-closure-source
          path: closure-artifacts/
          retention-days: 1
