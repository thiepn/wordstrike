name: UI3 hover modality materialize
on:
  push:
    branches: [feat/ui3-mode-select]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui3-mode-select
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hover modality fix
        run: python tools/ui3_hover_modality_patch.py
      - name: Run focused UI3 source contracts
        run: |
          node tests/mode-navigation.test.js
          node tests/mobileModeSelectDensity.test.js
          node tests/ui3-mode-select.test.js
      - name: Run canonical tests
        run: npm test
      - name: Commit verified hover modality fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui.js tests/ui3-mode-select.test.js
          git diff --cached --quiet && exit 0
          git commit -m "UI3: prevent hover from stealing keyboard selection"
          git push origin HEAD:feat/ui3-mode-select
