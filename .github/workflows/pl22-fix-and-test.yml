name: PL22 temporary verifier
on:
  push:
    branches: [codex/pl22-problem-words]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.head_commit.message != 'PL22 apply automated source fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl22-problem-words
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and commit narrow source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/practiceLab/practiceProblemWordsGenerator.js')
          s = p.read_text()
          old = 'word.surface === plan.target.entityKey'
          new = 'word.surfaceText === plan.target.entityKey'
          if old not in s:
              raise SystemExit('Expected PL22 lexical materialization check not found')
          p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/practiceLab/practiceProblemWordsGenerator.js
          git commit -m 'PL22 apply automated source fixes'
          git push origin HEAD:codex/pl22-problem-words
      - name: Run full suite
        run: npm test
