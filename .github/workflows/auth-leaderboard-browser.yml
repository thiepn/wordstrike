name: Auth and leaderboard browser certification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: python3 -m pip install -r tests/browser/requirements.txt
      - name: Certify Profile, Leaderboards and Settings
        run: |
          python3 tests/browser/ui11_profile_leaderboards_settings.py
          python3 tests/browser/ui11_mobile_heading_contract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-leaderboard-browser-evidence
          path: browser-artifacts/ui11-profile-leaderboards-settings/
          retention-days: 7
