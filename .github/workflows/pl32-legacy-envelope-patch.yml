name: PL32 Legacy Envelope Patch

on:
  push:
    branches: [pl32-treatment-response]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pl32-treatment-response
      - name: Align historical certification envelopes with DB10
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('tests').glob('*.test.js'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace('assert.equal(PRACTICE_DATABASE_VERSION, 9)', 'assert.equal(PRACTICE_DATABASE_VERSION, 10)')
              text = text.replace('assert.equal(PRACTICE_DATABASE_VERSION,9)', 'assert.equal(PRACTICE_DATABASE_VERSION,10)')
              text = text.replace('inside the PL31 DB9 envelope', 'inside the PL32 DB10 envelope')
              text = text.replace('current fresh DB v9 schema', 'current fresh DB10 schema')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print('Patched:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit compatibility-only test updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No compatibility patches required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git commit -m 'PL32: apply legacy certification envelope patches'
          git push origin HEAD:pl32-treatment-response
