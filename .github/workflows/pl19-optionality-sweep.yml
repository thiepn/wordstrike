name: PL19 Optional Assessment Contract

on:
  push:
    branches:
      - codex/pl19-full-assessment

permissions:
  contents: write

jobs:
  optionality:
    if: ${{ !contains(github.event.head_commit.message, '[pl19-optionality-sweep]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/pl19-full-assessment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pl19OptionalitySweep.mjs
      - run: git diff --check
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PL19: align optional assessment expectations [pl19-optionality-sweep]"
          git push origin HEAD:codex/pl19-full-assessment
