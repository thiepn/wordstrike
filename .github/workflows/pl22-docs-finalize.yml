name: PL22 documentation finalizer
on:
  push:
    branches: [codex/pl22-problem-words]
permissions:
  contents: write
jobs:
  append-docs:
    if: github.event.head_commit.message != 'PL22 append canonical documentation addenda'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl22-problem-words
          fetch-depth: 0
      - name: Append idempotent PL22 documentation addenda
        run: |
          python - <<'PY'
          from pathlib import Path

          addenda = {
            'docs/PRACTICE_LAB_LEARNING_CURVES_AND_SATURATION.md': r'''

          ## PL22 — Problem Words acquisition dose

          PL22 `problem-words` is a direct word-acquisition intervention. Its v1 standard session contributes exactly **15 direct target word opportunities = 1.0 PL16 word acquisition dose unit** for the single selected PL11 `word` entity. Incidental keys, bigrams, trigrams, and other words receive no direct PL22 acquisition dose.

          For trusted PL20–PL22 intervention objects, PL16 may consume the immutable explicit `entry-probe` and `exit-probe` phase bounds for entry/exit acquisition semantics. This privilege is object-bound by the intervention trust layer; serialized configuration or metadata alone cannot claim it. Generic Practice sessions continue to use the existing fallback phase semantics.

          PL22 itself does not decide long-term learning or saturation. PL16 remains the canonical owner of cumulative acquisition dose, longitudinal curves, marginal gain, saturation, and protected transfer observations.
          ''',
            'docs/PRACTICE_LAB_LIMITER_IMPACT_MODEL.md': r'''

          ## PL22 — Problem Words limiter consumption

          PL22 consumes canonical PL12 **word** limiter evaluations when building optional recommendations. Relevant word phenotypes include `launch-limited`, slow, hesitant, inaccurate, recovery-heavy, unstable, and mixed. `confirmed` and `likely` candidates are preferred; `possible` candidates are secondary.

          PL12 hierarchy explanation remains authoritative. A word strongly explained by lower-level keys/bigrams/trigrams may be de-emphasized, while an independent or launch-limited word is a natural PL22 candidate. PL22 never rewrites `hierarchy.explainedBy`, never declares a constituent entity causal, and never silently changes the intervention into Weak Keys or Combination Repair.
          ''',
            'docs/PRACTICE_LAB_MASTERY_AUTOMATICITY_MODEL.md': r'''

          ## PL22 — Problem Words mastery boundary

          Problem Words does **not** assign, promote, or persist mastery. PL15 remains the canonical derived mastery/automaticity owner. PL22 may use the current PL15 word stage to de-emphasize Robust/Retained recommendations, but manual practice remains available after normal target/content validation.

          A strong PL22 Check probe is immediate target-enriched training evidence only and cannot by itself produce `Mastered`, `Transferred`, `Robust`, or `Retained` semantics.
          ''',
            'docs/PRACTICE_LAB_TARGET_INDEX_ARCHITECTURE.md': r'''

          ## PL22 — word-to-training-content consumer

          PL22 is a production consumer of the PL7 **`word → training content`** reverse index and canonical per-content word annotations. Target lookup uses the canonical lowercase PL7/PL11 `lexicalKey`; substring scans are not target evidence. Content and annotation access is requested only with `partition = training` and training purpose.

          The generator validates family/content/hash binding and lowercase target surface identity before use. Generated word-sequence units are session-generated from approved training-derived lexical candidates and are not added to the static corpus. PL22 never target-selects transfer, benchmark, diagnostic, or research-holdout partitions.
          ''',
            'docs/PRACTICE_LAB_SESSION_ENGINE.md': r'''

          ## PL22 — Problem Words session contract

          PL22 executes one canonical Practice session with exactly one direct target `{ entityType: "word", entityKey }`. The role/purpose is `training`; corrections are allowed; the session is **non-resumable**; successful termination is content completion; and all five immutable phase boundaries are carried in the generated content plan:

          `Baseline (3) → Focus (4) → Context (3) → Mix (2) → Check (3)`.

          Focus uses a strong whole-word cue, Context a subtle whole-word cue, and Baseline/Mix/Check are uncued. The active session does not expose live aggregate WPM/accuracy, PB, leaderboard, metronome, or rhythm-coach feedback.

          PL22 declares no ability, performance-frontier, retention-review, protected-evaluation, or assessment measurement role. Its final Check is training evidence, not transfer.
          ''',
          }

          marker = '## PL22 —'
          changed = False
          for filename, addition in addenda.items():
              path = Path(filename)
              text = path.read_text()
              if marker in text and 'Problem Words' in text[text.find(marker):text.find(marker)+160]:
                  continue
              cleaned = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.strip('\n').splitlines())
              path.write_text(text.rstrip() + '\n\n' + cleaned + '\n')
              changed = True

          if not changed:
              print('PL22 addenda already present')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PRACTICE_LAB_LEARNING_CURVES_AND_SATURATION.md docs/PRACTICE_LAB_LIMITER_IMPACT_MODEL.md docs/PRACTICE_LAB_MASTERY_AUTOMATICITY_MODEL.md docs/PRACTICE_LAB_TARGET_INDEX_ARCHITECTURE.md docs/PRACTICE_LAB_SESSION_ENGINE.md
          git commit -m 'PL22 append canonical documentation addenda'
          git push origin HEAD:codex/pl22-problem-words
