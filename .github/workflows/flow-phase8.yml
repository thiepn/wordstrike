name: Flow Phase 8 UX certification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flow-phase8:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: python3 -m pip install -r tests/browser/requirements.txt
      - name: Certify Flow Phase 8 UX refinements
        run: python3 tests/browser/flow_phase8_ux.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-phase8-ux-evidence
          path: browser-artifacts/flow-phase8/
          retention-days: 7
