name: Finalize Practice Browser Repair
on:
  push:
    branches: [fix/practice-lab-playability]
    paths: ['.github/finalize-practice-repair.mjs', '.github/workflows/finalize-practice-repair.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/practice-lab-playability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded browser and offline fixes
        run: |
          node .github/finalize-practice-repair.mjs
          for file in js/practiceLab/*SessionHost.js; do node --check "$file"; done
          node tests/practice-offline-shell.test.js
          node tests/practice-session-privacy.test.js
          rm .github/finalize-practice-repair.mjs .github/workflows/finalize-practice-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/practiceLab/ sw.js tests/browser/practice_end_to_end.mjs .github/
          git commit -m 'fix(practice): support browser-safe corrections and refresh offline shell'
          git push origin HEAD:fix/practice-lab-playability
