name: PL29 implementation bootstrap

on:
  push:
    branches: [codex/pl29-consistency-endurance-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply tested PL29 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .pl29-bootstrap.00 .pl29-bootstrap.01 .pl29-bootstrap.02 .pl29-bootstrap.03 .pl29-bootstrap.04 .pl29-bootstrap.05 .pl29-bootstrap.06 .pl29-bootstrap.07 .pl29-bootstrap.08 \
            | base64 -d | gunzip > /tmp/pl29.patch
          echo "09950fcb4cfbb304280075f335a5986bc17fce2a4e879994a3917a216ef0a180  /tmp/pl29.patch" | sha256sum -c -
          git apply --check /tmp/pl29.patch
          git apply /tmp/pl29.patch
      - name: Build deterministic sustained form artifacts
        run: npm run build:practice-sustained
      - name: Targeted PL29 certification before commit
        run: npm run test:pl29-sustained
      - name: Commit PL29 product implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .pl29-bootstrap.00 .pl29-bootstrap.01 .pl29-bootstrap.02 .pl29-bootstrap.03 .pl29-bootstrap.04 .pl29-bootstrap.05 .pl29-bootstrap.06 .pl29-bootstrap.07 .pl29-bootstrap.08
          rm -f .github/workflows/pl29-artifacts.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(pl29): implement Consistency and Endurance"
          git push origin HEAD:codex/pl29-consistency-endurance-v1
