name: PL11 Stage

on:
  push:
    branches: [codex/pl11-contextual-skill-evidence]

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl11-contextual-skill-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply continuity and current-version updates
        run: |
          node --check scripts/applyPl11ContinuityFixes.mjs
          node scripts/applyPl11ContinuityFixes.mjs
          node --check scripts/applyPl11CurrentVersionTests.mjs
          node scripts/applyPl11CurrentVersionTests.mjs
          node --check js/practiceLab/practiceSkillEvidenceCollector.js
          node --check js/practiceLab/practiceSessionEngine.js
          node --check js/practiceLab/practiceValidation.js
          git diff --check
      - name: Commit gate updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js tests
          git commit -m "fix(practice): harden PL11 evidence continuity" || true
          git push origin HEAD:codex/pl11-contextual-skill-evidence
      - name: Run full tests
        run: npm test
