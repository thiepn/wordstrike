name: PL11 Stage

on:
  push:
    branches: [codex/pl11-contextual-skill-evidence]

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl11-contextual-skill-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update current-version assertions
        run: |
          node --check scripts/applyPl11CurrentVersionTests.mjs
          node scripts/applyPl11CurrentVersionTests.mjs
          git diff --check
      - name: Commit compatibility updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test(practice): advance current PL11 version assertions" || true
          git push origin HEAD:codex/pl11-contextual-skill-evidence
      - name: Run full tests
        run: npm test
