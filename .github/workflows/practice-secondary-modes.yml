name: Practice Secondary Modes
on:
  push:
    branches: [test/practice-secondary-modes]
permissions:
  contents: read
jobs:
  standardized-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.57.0
      - run: node --check tests/browser/practice_secondary_modes.mjs
      - run: node tests/browser/practice_secondary_modes.mjs
