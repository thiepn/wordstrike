name: Browser Certification Bugfix Validation

on:
  push:
    branches: ["fix/browser-certification-regressions"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: fix/browser-certification-regressions
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply browser certification repairs
        run: python .github/scripts/browser_certification_bugfix.py

      - name: Install Playwright dependencies
        shell: bash
        run: |
          pip install -r tests/browser/requirements.txt
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          python -m playwright install --with-deps chromium firefox

      - name: Run Node tests
        run: npm test

      - name: Run P1 browser certification
        shell: bash
        run: |
          baseline="$RUNNER_TEMP/wordstrike-p1-baseline"
          git worktree add --detach "$baseline" c02a421d94f8503336abea1c6aca188625fa305b
          BASELINE_DIR="$baseline" python tests/browser/customization_p1.py
          git worktree remove "$baseline" --force

      - name: Run P2 browser certification
        run: python tests/browser/customization_p2.py

      - name: Run P3 browser certification
        run: python tests/browser/customization_p3_release.py

      - name: Run non-Practice browser certification
        run: python tests/browser/non_practice_regressions.py

      - name: Commit validated repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/browser-certification-bugfix.yml
          git rm .github/scripts/browser_certification_bugfix.py
          git add tests/browser/customization_p1.py tests/browser/customization_p2.py tests/browser/customization_p3_release.py tests/browser/non_practice_regressions.py
          git commit -m "Fix stale browser certification regressions"
          git push origin HEAD:fix/browser-certification-regressions
