name: Browser Certification Bugfix Validation

on:
  push:
    branches:
      - fix/browser-certification-regressions

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bugfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/browser-certification-regressions
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair stale browser certification assumptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          seed_files = [
              Path('tests/browser/customization_p1.py'),
              Path('tests/browser/customization_p2.py'),
              Path('tests/browser/customization_p3_release.py'),
              Path('tests/browser/non_practice_regressions.py'),
          ]
          for path in seed_files:
              text = path.read_text()
              count = text.count('campaign:1')
              if count < 1:
                  raise AssertionError(f'{path}: expected stale campaign:1 onboarding seed')
              path.write_text(text.replace('campaign:1', 'campaign:2'))

          p1 = Path('tests/browser/customization_p1.py')
          text = p1.read_text()
          old = '''  campaign=page.screenshot(animations='disabled',caret='hide')
  outputs.append([title,modes,campaign]);context.close()
 for i,label in enumerate(['title','mode-select','campaign-route']):'''
          new = '''  # Campaign Route intentionally evolves with Campaign features and has its own
  # browser certifications. P1 only freezes global surfaces that customization
  # itself promises to leave pixel-identical.
  outputs.append([title,modes]);context.close()
 for i,label in enumerate(['title','mode-select']):'''
          if text.count(old) != 1:
              raise AssertionError('P1 default-equivalence campaign block not found exactly once')
          text = text.replace(old, new, 1)
          old_screens = "checks.append({'browser':name,'case':'default screenshot equivalence','screens':['title','mode-select','campaign-route']})"
          new_screens = "checks.append({'browser':name,'case':'default screenshot equivalence','screens':['title','mode-select']})"
          if text.count(old_screens) != 1:
              raise AssertionError('P1 default-equivalence screen list not found exactly once')
          p1.write_text(text.replace(old_screens, new_screens, 1))

          for path in seed_files:
              if 'campaign:1' in path.read_text():
                  raise AssertionError(f'{path}: stale Campaign onboarding version remains')
          PY

      - name: Install browser test dependencies
        run: |
          pip install -r tests/browser/requirements.txt
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          python -m playwright install --with-deps chromium firefox

      - name: Run Node regression suite
        run: npm test

      - name: Run P1 customization browser certification
        shell: bash
        run: |
          BASELINE="$RUNNER_TEMP/wordstrike-p1-baseline"
          git worktree add --detach "$BASELINE" c02a421d94f8503336abea1c6aca188625fa305b
          BASELINE_DIR="$BASELINE" python tests/browser/customization_p1.py
          git worktree remove "$BASELINE" --force

      - name: Run P2 mode customization certification
        run: python tests/browser/customization_p2.py

      - name: Run P3 release certification
        run: python tests/browser/customization_p3_release.py

      - name: Run non-Practice browser regressions
        run: python tests/browser/non_practice_regressions.py

      - name: Commit validated bugfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/browser-certification-bugfix.yml
          git add \
            tests/browser/customization_p1.py \
            tests/browser/customization_p2.py \
            tests/browser/customization_p3_release.py \
            tests/browser/non_practice_regressions.py
          git commit -m "Fix stale browser certification regressions"
          git push origin HEAD:fix/browser-certification-regressions
