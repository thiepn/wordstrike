name: Practice Completion
on:
  push:
    branches: [finish-practice-lab]
  pull_request:
    paths: ['js/practiceLab/**', 'data/practice/**', 'tests/browser/practice_completion.py', '.github/workflows/practice-completion.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -r tests/browser/requirements.txt
      - run: python3 tests/browser/practice_completion.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-completion-browser
          path: browser-artifacts/practice-completion/
