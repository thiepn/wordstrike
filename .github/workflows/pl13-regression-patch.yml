name: PL13 Regression Patch

on:
  push:
    branches: [codex/pl13-ability-estimator-uncertainty]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl13-ability-estimator-uncertainty
          fetch-depth: 0
      - name: Advance PL12 isolation wrapper expectations through PL13
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/practice-limiter-service-isolation.test.js')
          s = p.read_text()
          old = '''test("PL12 leaves PL11 storage/session/foundation contracts unchanged and keeps custom-word persistence disabled", () => {
            assert.equal(PRACTICE_DATABASE_VERSION, 2);
            assert.equal(PRACTICE_RECORD_VERSIONS.skillStat, 3);
            assert.equal(PRACTICE_RECORD_VERSIONS.sessionSummary, 6);
            assert.equal(PRACTICE_RECORD_VERSIONS.checkpoint, 3);
            assert.equal(PRACTICE_FOUNDATION_ANALYSIS_VERSION, 4);'''.replace('            ', '  ')
          new = '''test("PL12 model contracts remain unchanged inside the current PL13 storage/session/foundation envelope", () => {
            assert.equal(PRACTICE_DATABASE_VERSION, 3);
            assert.equal(PRACTICE_RECORD_VERSIONS.skillStat, 3);
            assert.equal(PRACTICE_RECORD_VERSIONS.sessionSummary, 7);
            assert.equal(PRACTICE_RECORD_VERSIONS.checkpoint, 3);
            assert.equal(PRACTICE_FOUNDATION_ANALYSIS_VERSION, 5);'''.replace('            ', '  ')
          if old not in s:
              raise SystemExit('expected PL12 wrapper block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/practice-limiter-service-isolation.test.js
          git commit -m "test(practice): preserve PL12 models inside PL13 wrappers"
          git push origin HEAD:codex/pl13-ability-estimator-uncertainty
