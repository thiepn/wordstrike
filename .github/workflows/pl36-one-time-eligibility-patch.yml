name: PL36 One-Time Eligibility Patch

on:
  push:
    branches: [pl36-physical-keyboard-telemetry]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pl36-physical-keyboard-telemetry
          fetch-depth: 0
      - name: Patch excluded-event coverage semantics
        shell: python
        run: |
          from pathlib import Path
          path = Path('js/practiceLab/practicePhysicalTelemetryAccumulator.js')
          text = path.read_text(encoding='utf-8')
          old = '''    eligibleTextEventCount += 1;
    if (!physicalEvent || !isPracticePhysicalTelemetryEventEligible(physicalEvent)) {
      if (physicalEvent?.repeat) excludedRepeatCount += 1;
      else if (physicalEvent?.composing) excludedCompositionCount += 1;
      else if (physicalEvent?.dead) excludedDeadKeyCount += 1;
      else if (physicalEvent?.commandShortcut) excludedShortcutCount += 1;
      else excludedCodeCount += 1;
      priorCanonicalInsertion = processedInput.event ?? null;
      priorPhysicalSuccess = null;
      correctionSincePrior = false;
      return false;
    }
    validCodeEventCount += 1;'''
          new = '''    if (physicalEvent?.repeat || physicalEvent?.composing || physicalEvent?.dead || physicalEvent?.commandShortcut) {
      if (physicalEvent.repeat) excludedRepeatCount += 1;
      else if (physicalEvent.composing) excludedCompositionCount += 1;
      else if (physicalEvent.dead) excludedDeadKeyCount += 1;
      else excludedShortcutCount += 1;
      priorCanonicalInsertion = processedInput.event ?? null;
      priorPhysicalSuccess = null;
      correctionSincePrior = false;
      return false;
    }
    eligibleTextEventCount += 1;
    if (!physicalEvent || !isPracticePhysicalTelemetryEventEligible(physicalEvent)) {
      excludedCodeCount += 1;
      priorCanonicalInsertion = processedInput.event ?? null;
      priorPhysicalSuccess = null;
      correctionSincePrior = false;
      return false;
    }
    validCodeEventCount += 1;'''
          if text.count(old) != 1:
              raise SystemExit('Expected accumulator block not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/pl36-one-time-eligibility-patch.yml').unlink()
      - name: Commit eligibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PL36 exclude non-telemetry events from coverage"
          git push origin HEAD:pl36-physical-keyboard-telemetry
