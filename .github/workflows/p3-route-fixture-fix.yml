name: P3 route fixture fix
on:
  push:
    branches: [qa/customization-p3-release]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/customization-p3-release
      - name: Route Endless and Rush through Mode Select
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser/customization_p3_release.py')
          s=p.read_text()
          old='''                page.goto(base + "?mode=endless&seed=906")\n                panel = open_panel(page, "endless")\n'''
          new='''                open_title(page, base)\n                page.locator('[data-action="modes"]').click()\n                page.locator('[data-mode-id="endless"]').click()\n                expect(page.locator(".endless-ready-screen")).to_be_visible()\n                panel = open_panel(page, "endless")\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''        page.goto(base + "?mode=arcade-rush&seed=907")\n        panel = open_panel(page, "arcade-rush")\n'''
          new='''        open_title(page, base)\n        page.locator('[data-action="modes"]').click()\n        page.locator('[data-mode-id="arcade-rush"]').click()\n        expect(page.locator('[data-rush-view="ready"]')).to_be_visible()\n        panel = open_panel(page, "arcade-rush")\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/customization_p3_release.py
          git commit -m "Use player routes in P3 mode audit"
          git push origin HEAD:qa/customization-p3-release
