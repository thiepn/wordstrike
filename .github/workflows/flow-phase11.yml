name: Flow Phase 11 integration certification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flow-phase11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: python3 -m pip install -r tests/browser/requirements.txt
      - name: Certify Flow Phase 11 progression and integration
        run: python3 tests/browser/flow_phase11_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-phase11-integration-evidence
          path: browser-artifacts/flow-phase11/
          retention-days: 7
