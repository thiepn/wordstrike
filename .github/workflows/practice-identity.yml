name: Practice Studio UI
on:
  push:
    branches: [main, ui/practice-studio]
    paths: ['js/practiceLab/**', 'practiceLab*.css', 'index.html', 'sw.js', 'tests/practice-lab-identity.test.js', 'tests/browser/practice_*.mjs', 'scripts/auditPracticePrivacySecurity.mjs', '.github/workflows/practice-identity.yml', '.github/apply-practice-studio.mjs']
  pull_request:
    paths: ['js/practiceLab/**', 'practiceLab*.css', 'index.html', 'sw.js', 'tests/practice-lab-identity.test.js', 'tests/browser/practice_*.mjs', '.github/workflows/practice-identity.yml']
permissions:
  contents: read
concurrency:
  group: practice-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: source
        run: |
          if [ -f .github/apply-practice-studio.mjs ]; then
            node .github/apply-practice-studio.mjs
            node --check js/practiceLab/practiceLabIdentity.js
            node --check js/practiceLab/practiceLabControllerRuntimeV40.js
            node scripts/auditPracticePrivacySecurity.mjs > /tmp/privacy.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html sw.js scripts/auditPracticePrivacySecurity.mjs tests/browser/practice_completion.mjs js/practiceLab/practiceLabIdentity.js .github/apply-practice-studio.mjs
            git commit -m 'feat(practice): integrate Studio presentation and refresh offline shell'
            git push origin HEAD:ui/practice-studio
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  core:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p browser-artifacts/studio-core
          npm test > browser-artifacts/studio-core/unit.log 2>&1
          node scripts/auditPracticePrivacySecurity.mjs > browser-artifacts/studio-core/security.json
          node scripts/validatePracticeReleaseContent.mjs > browser-artifacts/studio-core/content.json
          node scripts/testPracticeMigrations.mjs > browser-artifacts/studio-core/migrations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-core
          path: browser-artifacts/studio-core/
          retention-days: 7
  browsers:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            widths: '1440,768,390,320'
          - browser: firefox
            widths: '1280'
          - browser: webkit
            widths: '390'
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
      PRACTICE_BROWSER: ${{ matrix.browser }}
      PRACTICE_BROWSERS: ${{ matrix.browser }}
      PRACTICE_WIDTHS: ${{ matrix.widths }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.57.0 axe-core@4.10.3
      - name: UI accessibility navigation and screenshots
        run: node tests/browser/practice_identity.mjs
      - name: UI evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-ui-${{ matrix.browser }}
          path: browser-artifacts/practice-identity/
          retention-days: 7
      - name: All public sessions complete and persist
        if: ${{ !cancelled() }}
        run: node tests/browser/practice_end_to_end.mjs
      - name: Protected assessment and protocol journeys
        if: ${{ !cancelled() }}
        run: node tests/browser/practice_completion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-${{ matrix.browser }}
          path: browser-artifacts/
          retention-days: 7
