name: Practice Studio UI
on:
  push:
    branches: [main, ui/practice-studio]
    paths: ['js/practiceLab/**', 'practiceLab*.css', 'index.html', 'sw.js', 'tests/practice-lab-identity.test.js', 'tests/browser/practice_*.mjs', 'scripts/auditPracticePrivacySecurity.mjs', '.github/workflows/practice-identity.yml']
  pull_request:
    paths: ['js/practiceLab/**', 'practiceLab*.css', 'index.html', 'sw.js', 'tests/practice-lab-identity.test.js', 'tests/browser/practice_*.mjs', '.github/workflows/practice-identity.yml']
permissions:
  contents: read
concurrency:
  group: practice-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p browser-artifacts/studio-core
          npm test > browser-artifacts/studio-core/unit.log 2>&1
          node scripts/auditPracticePrivacySecurity.mjs > browser-artifacts/studio-core/security.json
          node scripts/validatePracticeReleaseContent.mjs > browser-artifacts/studio-core/content.json
          node scripts/testPracticeMigrations.mjs > browser-artifacts/studio-core/migrations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-core
          path: browser-artifacts/studio-core/
          retention-days: 7
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            width: 390
            widths: '1440,768,390,320'
          - browser: firefox
            width: 1280
            widths: '1280'
          - browser: webkit
            width: 390
            widths: '390'
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
      PRACTICE_BROWSER: ${{ matrix.browser }}
      PRACTICE_BROWSERS: ${{ matrix.browser }}
      PRACTICE_WIDTH: ${{ matrix.width }}
      PRACTICE_WIDTHS: ${{ matrix.widths }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.57.0 axe-core@4.10.3
      - name: UI accessibility navigation and screenshots
        run: node tests/browser/practice_identity.mjs
      - name: UI evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-ui-${{ matrix.browser }}
          path: browser-artifacts/practice-identity/
          retention-days: 7
      - name: All public sessions complete and persist
        if: ${{ !cancelled() }}
        run: node tests/browser/practice_end_to_end.mjs
      - name: Protected assessment and protocol journeys
        if: ${{ !cancelled() }}
        run: node tests/browser/practice_completion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-${{ matrix.browser }}
          path: browser-artifacts/
          retention-days: 7
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.57.0 axe-core@4.10.3
      - name: Wait for deployed assets and verify live practice persistence
        run: node tests/browser/practice_live_smoke.mjs
      - name: Verify the live Studio on desktop and phone-sized layouts
        env:
          PRACTICE_URL: https://thiepn.dev/wordstrike/
          PRACTICE_BROWSER: chromium
          PRACTICE_WIDTHS: '1440,390'
        run: node tests/browser/practice_identity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-production
          path: |
            browser-artifacts/practice-live/
            browser-artifacts/practice-identity/
          retention-days: 7
