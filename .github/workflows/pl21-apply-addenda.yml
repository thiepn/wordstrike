name: PL21 apply addenda

on:
  pull_request:
    branches:
      - codex/pl20-combination-repair

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/pl21-weak-keys'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/applyPl21WeakKeysAddenda.mjs
      - name: Commit generated addenda
        run: |
          if git diff --quiet; then
            echo "No PL21 addenda changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/practiceLab/practiceWeakKeysGenerator.js docs/PRACTICE_LAB_LEARNING_CURVES_AND_SATURATION.md docs/PRACTICE_LAB_LIMITER_IMPACT_MODEL.md docs/PRACTICE_LAB_MASTERY_AUTOMATICITY_MODEL.md docs/PRACTICE_LAB_SESSION_ENGINE.md
          git commit -m "PL21: harden generator and document model integration"
          git push origin HEAD:${{ github.head_ref }}
