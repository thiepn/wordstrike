name: PL19 Compatibility Sweep

on:
  push:
    branches:
      - codex/pl19-full-assessment

permissions:
  contents: write

jobs:
  sweep:
    if: ${{ !contains(github.event.head_commit.message, '[pl19-compat-sweep]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/pl19-full-assessment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply PL19 structural compatibility sweep
        run: node scripts/pl19CompatibilitySweep.mjs
      - name: Verify diff
        run: git diff --check
      - name: Commit sweep and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No compatibility changes required."
            exit 0
          fi
          git commit -m "PL19: advance compatibility wrappers [pl19-compat-sweep]"
          git push origin HEAD:codex/pl19-full-assessment
