name: PL9 Apply

on:
  push:
    branches:
      - codex/pl9-error-recovery-model

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/pl9-error-recovery-model
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply PL9 source patches
        run: |
          node --check scripts/applyPl9Core.mjs
          node --check scripts/applyPl9Validation.mjs
          node --check scripts/applyPl9BehaviorFixes.mjs
          node scripts/applyPl9Core.mjs
          node scripts/applyPl9Validation.mjs
          node scripts/applyPl9BehaviorFixes.mjs
      - name: Focused PL9 tests
        run: |
          node tests/practice-error-alignment.test.js
          node tests/practice-error-tracker.test.js
          node tests/practice-error-reconstruction.test.js
          node tests/practice-error-foundation.test.js
          node tests/practice-error-migration-validation.test.js
          node tests/practice-error-session-integration.test.js
          node tests/practice-error-large-session.test.js
          node tests/practice-error-import-side-effects.test.js
          node tests/practice-latency-classifier.test.js
          node tests/practice-latency-session-integration.test.js
          node tests/practice-session-checkpoint-completion.test.js
          node tests/practice-validation-migrations.test.js
      - name: Full WordStrike suite
        run: npm test
      - name: Commit PL9 implementation
        run: |
          rm -f scripts/applyPl9Integration.mjs scripts/applyPl9Followup.mjs scripts/applyPl9Core.mjs scripts/applyPl9Validation.mjs scripts/applyPl9BehaviorFixes.mjs .github/workflows/pl9-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(practice): implement PL9 error recovery analysis"
          git push origin HEAD:codex/pl9-error-recovery-model
