name: PL19 Test Corrections

on:
  push:
    branches:
      - codex/pl19-full-assessment

permissions:
  contents: write

jobs:
  correct:
    if: ${{ !contains(github.event.head_commit.message, '[pl19-test-corrections]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/pl19-full-assessment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused PL19 corrections
        run: node scripts/pl19TestCorrections.mjs
      - name: Verify diff
        run: git diff --check
      - name: Commit corrections and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No correction changes required."
            exit 0
          fi
          git commit -m "PL19: correct focused fixtures [pl19-test-corrections]"
          git push origin HEAD:codex/pl19-full-assessment
