name: V13 native results migration

on:
  pull_request:
    types:
      - reopened
    branches:
      - v12-typing-results-runtime

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'v13-native-results-pipeline'
    runs-on: ubuntu-latest
    steps:
      - name: Check out V13 branch
        uses: actions/checkout@v4
        with:
          ref: v13-native-results-pipeline
          fetch-depth: 0
      - name: Apply proven source migration
        shell: bash
        run: |
          set +e
          node scripts/v13MigrateNativeResults.mjs
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected the proven migration to stop at the superseded historical-test matcher; got status $status"
            exit 1
          fi
      - name: Finish deterministic contract migration
        run: node scripts/v13FinishNativeResultsMigration.mjs
      - name: Commit migration output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "V13: retire results observer compatibility bridge"
          git push origin HEAD:v13-native-results-pipeline
