name: PL26 typability artifact refresh

on:
  push:
    branches:
      - codex/pl26-pace-ladder-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild PL10 typability artifacts
        run: node scripts/buildPracticeTypability.mjs
      - name: Validate regenerated artifacts
        run: node scripts/buildPracticeTypability.mjs --validate
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/practice/models/en-v1 js/practiceLab/generated/practiceTypabilityRuntimeData.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'PL26: refresh PL10 typability artifacts'
          git push
