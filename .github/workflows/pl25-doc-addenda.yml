name: PL25 documentation addenda

on:
  push:
    branches:
      - codex/pl25-daily-coach-v1

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl25-daily-coach-v1
          fetch-depth: 0
      - name: Append PL25 ownership contracts
        shell: python
        run: |
          from pathlib import Path

          addenda = {
            'docs/PRACTICE_LAB_REVIEW_VALUE_AND_RETENTION_SCHEDULER.md': '''

---

## PL25 Daily Coach addendum

PL25 consumes PL17 as the sole owner of retention scheduling and delayed verification. Daily Coach may place a hidden `daily-coach-review` block first when current PL17 due/overdue Review Value justifies it, but the block remains a genuine `retentionMeasurementKind = "entity-review"` session using training-partition content and PL17 cycle bindings. It is not an acquisition intervention, and it emits zero PL16 acquisition observations.

PL25 also hardens the intervening-direct-practice rule. When newer direct practice occurs after an active review cycle's `referenceAtUtc`, PL17 refreshes that reference time and recomputes maturity/due timing from current stability. Existing cycle verification history is preserved; the direct practice itself is not counted as a retention verification. Material reference-quality upgrades and failure/reacquisition retain their existing cycle-reset semantics.

Daily Coach never owns due dates, retention outcomes, stability, verification counts, or Retained-stage eligibility. If a frozen Coach Review binding is stale at block start, the block is blocked rather than silently rebound or replaced.
''',
            'docs/PRACTICE_LAB_LEARNING_CURVES_AND_SATURATION.md': '''

---

## PL25 Daily Coach addendum

Daily Coach is an orchestration consumer of PL16, not a learning-state owner. It may read current saturation and marginal-gain evidence to de-emphasize low-headroom targets, but it does not rewrite curves, observations, dose, or saturation status.

Each targeted PL20–PL23 child preserves its own canonical direct-target opportunity contract and therefore contributes the same PL16 acquisition dose it would contribute when launched manually. The hidden Coach Review is a PL17 retention measurement and contributes zero acquisition observations. PL24 Real Text remains target-blind and contributes zero direct acquisition dose. PL25 itself never manufactures a learning observation merely because a block appeared in a daily plan.
''',
            'docs/PRACTICE_LAB_SESSION_ENGINE.md': '''

---

## PL25 Daily Coach addendum

PL25 adds a nullable `coachBinding` to `sessionSummary` v13 while foundation analysis remains v10. The binding is compact (`coachPlanId`, `blockId`, `blockOrdinal`, planner version, plan hash) and is trusted only through an object-bound content-plan registration. User/session configuration cannot set `coachBinding`, and `targetSource = "external-plan"` is rejected without that trust.

At preparation, the engine verifies profile/context identity, frozen plan hash, block ordinal, planned child session ID, experiment identity, and the block-specific target/review/Real-Text contract. Assessment and Coach bindings are mutually exclusive. Child completion is reconciled exactly once back to the matching active Coach block; a stale parent produces a diagnostic rather than reinterpreting the child. PL25 Coach children remain non-resumable unless their underlying protocol explicitly establishes otherwise in a future version.
''',
            'docs/PRACTICE_LAB_LIMITER_IMPACT_MODEL.md': '''

---

## PL25 Daily Coach addendum

PL12 remains the sole owner of limiter status, phenotype, impact, hierarchy, and priority. PL25 reads bounded likely/confirmed limiter candidates as planning inputs and applies a separate Coach Target Utility for scheduling. This does not create a new limiter diagnosis or alter PL12 state.

Hierarchy is used defensively to avoid treating one explained limiter chain as multiple independent same-day targets. A candidate suppressed or de-emphasized by Daily Coach remains unchanged in PL12 and remains manually trainable through its normal intervention surface.
''',
            'docs/PRACTICE_LAB_MASTERY_AUTOMATICITY_MODEL.md': '''

---

## PL25 Daily Coach addendum

PL15 remains the sole owner of mastery, automaticity, robustness, transfer interpretation, and Retained-stage progression. Daily Coach may use the current mastery stage as one utility modifier when deciding whether additional acquisition practice has useful headroom, but it never assigns, promotes, demotes, or persists a mastery stage.

PL17 retention evidence and PL11/PL18 transfer evidence continue to reach PL15 through their canonical paths. A Coach block being completed, skipped, blocked, or invalid has no mastery meaning by itself.
''',
            'docs/PRACTICE_LAB_PERFORMANCE_STATE_AND_FRONTIER.md': '''

---

## PL25 Daily Coach addendum

PL14 performance state is a read-only readiness input to Daily Coach. Current readiness may down-weight focused target utility or change ordering so broad Real Text occurs before focused acquisition. `unknown` or stale readiness is not interpreted as poor performance, and PL25 creates no new PL14 measurement merely by planning or running a day.

Daily Coach does not modify the control frontier, warm-up model, burst reserve, or any performance-state policy. Dedicated measurement protocols remain authoritative for those states.
''',
            'docs/PRACTICE_LAB_DATA_ARCHITECTURE.md': '''

---

## PL25 Daily Coach persistence addendum

PL25 advances the Practice database to v8 and adds one `coachPlans` store. There is at most one canonical plan per `profileId + contextId + localDayKey`, enforced by the unique `profileContextDay` index. Plans are bounded compact decision records; raw traces, mistyped strings, protected text, custom text, and private notes are forbidden.

`sessionSummary` advances from v12 to v13 solely to add nullable compact `coachBinding`, plus a `coachPlanId` lookup index for child reconciliation. `skillStat`, `learningState`, `reviewItem`, `evaluationState`, `assessmentRun`, and foundation-analysis versions do not change. Ordinary sessions migrate with `coachBinding = null`.

Coach-plan retention is bounded independently of session history. Active/current-day plans and active child session summaries are protected from ordinary pruning; old terminal plans may be pruned under the PL25 limits.
''',
          }

          marker = '## PL25 Daily Coach addendum'
          alt_marker = '## PL25 Daily Coach persistence addendum'
          for name, appendix in addenda.items():
              path = Path(name)
              text = path.read_text()
              if marker in text or alt_marker in text:
                  continue
              path.write_text(text.rstrip() + appendix + '\n')

          Path('.github/workflows/pl25-doc-addenda.yml').unlink()
      - name: Commit permanent docs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PL25: document Daily Coach ownership boundaries"
          git push origin HEAD:codex/pl25-daily-coach-v1
