name: PL29 source snapshot

on:
  push:
    branches: [codex/pl29-consistency-endurance-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upload tracked source
        uses: actions/upload-artifact@v4
        with:
          name: pl29-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
