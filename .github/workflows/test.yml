name: Tests

on:
  push:
    branches: [main, codex/pl28-common-words-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          npm test 2>&1 | tee test-artifacts/node-tests.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-evidence
          path: test-artifacts/node-tests.log
          retention-days: 7
          if-no-files-found: warn
