name: Temporary Wordstrike PWA Cache Policy

on:
  push:
    branches: [pwa-upgrade-worker]
    paths:
      - '.github/workflows/pwa-cache-policy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make runtime cache update-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sw.js')
          text = p.read_text(encoding='utf-8')
          old = '''  event.respondWith(caches.match(request).then(cached => cached || fetch(request).then(response => {
            if (response && response.ok) {
              const copy = response.clone();
              caches.open(CACHE_NAME).then(cache => cache.put(request, copy));
            }
            return response;
          })));
          });'''
          new = '''  event.respondWith(fetch(request).then(response => {
            if (response && response.ok) {
              const copy = response.clone();
              caches.open(CACHE_NAME).then(cache => cache.put(request, copy));
            }
            return response;
          }).catch(() => caches.match(request)));
          });'''
          if text.count(old) != 1:
              raise SystemExit('Expected cache-first handler not found exactly once')
          text = text.replace(old, new)
          text = text.replace('const CACHE_NAME = CACHE_PREFIX + "v1";', 'const CACHE_NAME = CACHE_PREFIX + "v2";', 1)
          p.write_text(text, encoding='utf-8')
          assert 'caches.match(request).then(cached => cached || fetch(request)' not in text
          assert 'fetch(request).then(response =>' in text
          print('Wordstrike runtime cache is network-first with offline fallback')
          PY
      - name: Commit cache policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "Make Wordstrike PWA cache update-safe"
          git push origin HEAD:pwa-upgrade-worker
