name: Verify Practice Repair Release
on:
  push:
    branches: [fix/practice-lab-playability]
    paths: ['.github/verify-practice-repair.mjs', '.github/workflows/verify-practice-repair.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/practice-lab-playability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update reviewed sink inventory and diagnostic tests
        id: commit
        run: |
          node .github/verify-practice-repair.mjs
          node --check tests/browser/practice_end_to_end.mjs
          node scripts/auditPracticePrivacySecurity.mjs > /tmp/security.json
          rm .github/verify-practice-repair.mjs .github/workflows/verify-practice-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/auditPracticePrivacySecurity.mjs tests/browser/practice_end_to_end.mjs .github/
          git commit -m 'test(practice): exercise count sessions in real time and certify centralized HTML sinks'
          git push origin HEAD:fix/practice-lab-playability
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  core:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p browser-artifacts/release-core
          npm test > browser-artifacts/release-core/unit.log 2>&1
          node scripts/validatePracticeReleaseContent.mjs > browser-artifacts/release-core/content.json
          node scripts/auditPracticePrivacySecurity.mjs > browser-artifacts/release-core/security.json
          node scripts/testPracticeMigrations.mjs > browser-artifacts/release-core/migrations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-release-core
          path: browser-artifacts/release-core/
          retention-days: 7
  browsers:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            width: 1280
          - browser: firefox
            width: 1280
          - browser: webkit
            width: 390
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
      PRACTICE_BROWSERS: ${{ matrix.browser }}
      PRACTICE_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.57.0
      - name: Complete all public sessions
        run: node tests/browser/practice_end_to_end.mjs
      - name: Assessment and protected protocol regression
        if: ${{ !cancelled() }}
        run: node tests/browser/practice_completion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-release-${{ matrix.browser }}
          path: browser-artifacts/
          retention-days: 7
