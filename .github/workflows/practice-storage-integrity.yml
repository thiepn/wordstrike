name: Practice Storage Integrity
on:
  push:
    branches: [main, fix/practice-durable-storage]
    paths: ['js/practiceLab/**', 'tests/practice-*.test.js', 'tests/browser/practice_quota_journey.mjs', '.github/workflows/practice-storage-integrity.yml', 'sw.js']
permissions:
  contents: read
concurrency:
  group: practice-storage-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
      PRACTICE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.57.0
      - run: node tests/browser/practice_quota_journey.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-quota-${{ matrix.browser }}
          path: browser-artifacts/practice-quota-journey/
          retention-days: 7
