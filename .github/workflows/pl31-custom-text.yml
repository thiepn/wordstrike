name: PL31 Custom Text

on:
  pull_request:
  push:
    branches: [pl31-custom-text]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run PL31 Custom Text certification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          npm run test:pl31-custom-text 2>&1 | tee test-artifacts/pl31-custom-text.log
      - name: Upload PL31 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl31-custom-text-evidence
          path: test-artifacts/pl31-custom-text.log
          retention-days: 7
          if-no-files-found: warn
