name: PL35 Metronome Typing

on:
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PL35 Metronome Typing certification
        run: npm run test:pl35-metronome
      - name: Full WordStrike regression suite
        run: npm test
