name: PL31 runtime audit fixes

on:
  push:
    branches: [pl31-custom-text]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited controller/runtime fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path('js/practiceLab/practiceLabControllerRuntimeV31.js')
          text = controller.read_text(encoding='utf-8')
          old = '  const confirmDiscard = () => !dirty() || globalThis.confirm?.("Discard unsaved Custom Text changes?") !== false;\n'
          new = old + '  const discardEditor = () => { state = { ...state, editor: { ...emptyEditor(), dataLocale: state.contextDataLocale }, localeMismatch: false, errorCode: null, dirty: false }; };\n'
          if old not in text:
              raise SystemExit('confirmDiscard anchor missing')
          text = text.replace(old, new, 1)
          old = 'if (action === "back") { if (confirmDiscard()) { const value = base.back(); queueMicrotask(afterRoute); return value; } return; }'
          new = 'if (action === "back") { if (confirmDiscard()) { if (dirty()) discardEditor(); const value = base.back(); queueMicrotask(afterRoute); return value; } return; }'
          if old not in text:
              raise SystemExit('click back anchor missing')
          text = text.replace(old, new, 1)
          old = 'navigate(...args) { if (routeId(base) === CUSTOM && !host && !confirmDiscard()) return false; const value = base.navigate(...args); queueMicrotask(afterRoute); return value; },'
          new = 'navigate(...args) { if (routeId(base) === CUSTOM && !host) { if (!confirmDiscard()) return false; if (dirty()) discardEditor(); } const value = base.navigate(...args); queueMicrotask(afterRoute); return value; },'
          if old not in text:
              raise SystemExit('navigate anchor missing')
          text = text.replace(old, new, 1)
          old = 'back() { if (host) { void host.stop?.(); return true; } if (routeId(base) === CUSTOM && !confirmDiscard()) return false; const value = base.back(); queueMicrotask(afterRoute); return value; },'
          new = 'back() { if (host) { void host.stop?.(); return true; } if (routeId(base) === CUSTOM) { if (!confirmDiscard()) return false; if (dirty()) discardEditor(); } const value = base.back(); queueMicrotask(afterRoute); return value; },'
          if old not in text:
              raise SystemExit('back method anchor missing')
          text = text.replace(old, new, 1)
          controller.write_text(text, encoding='utf-8')

          runtime = Path('js/practiceLab/practiceCustomTextRuntime.js')
          text = runtime.read_text(encoding='utf-8')
          old = '    close() { ownedDataStore?.close?.(); },'
          new = '    close() { initializedPromise = null; ownedDataStore?.close?.(); },'
          if old not in text:
              raise SystemExit('runtime close anchor missing')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/practice-custom-text-pl31.test.js')
          text = tests.read_text(encoding='utf-8')
          anchor = 'test("PL31 retention and ordinary reset code do not prune Custom Text", () => {'
          if anchor not in text:
              raise SystemExit('PL31 test anchor missing')
          extra = '''test("PL31 controller discards confirmed dirty drafts and runtime can reopen after close", () => {\n  const controller = fs.readFileSync(new URL("../js/practiceLab/practiceLabControllerRuntimeV31.js", import.meta.url), "utf8");\n  const runtime = fs.readFileSync(new URL("../js/practiceLab/practiceCustomTextRuntime.js", import.meta.url), "utf8");\n  assert.match(controller, /const discardEditor/);\n  assert.match(controller, /if \(dirty\(\)\) discardEditor\(\)/);\n  assert.match(runtime, /initializedPromise = null; ownedDataStore/);\n});\n\n'''
          tests.write_text(text.replace(anchor, extra + anchor, 1), encoding='utf-8')
          PY
          git rm .github/workflows/pl31-runtime-audit-fix.yml
          git diff --check
      - name: Commit audit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/practiceLab/practiceLabControllerRuntimeV31.js js/practiceLab/practiceCustomTextRuntime.js tests/practice-custom-text-pl31.test.js
          git commit -m "PL31: fix discarded draft and runtime reopen behavior"
          git push origin HEAD:pl31-custom-text
