name: Practice Production Smoke
on:
  push:
    branches: [main]
    paths: ['js/practiceLab/**', 'practiceLab*.css', 'index.html', 'sw.js', 'tests/browser/practice_live_smoke.mjs', '.github/workflows/practice-live-smoke.yml']
permissions:
  contents: read
concurrency:
  group: practice-production-smoke
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.57.0
      - name: Wait for this deployment and practice on the live site
        run: node tests/browser/practice_live_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-production-smoke
          path: browser-artifacts/practice-live/
          retention-days: 7
