name: Practice Playability Repair
on:
  push:
    branches: [main, fix/practice-lab-playability]
    paths: ['js/practiceLab/**', 'tests/browser/practice_playability.mjs', '.github/workflows/practice-playability.yml']
  pull_request:
    paths: ['js/practiceLab/**', 'tests/browser/practice_playability.mjs', '.github/workflows/practice-playability.yml']
permissions:
  contents: read
concurrency:
  group: practice-playability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  public-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
      PRACTICE_BROWSERS: chromium,firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.57.0
      - run: node tests/browser/practice_playability.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-playability-evidence
          path: browser-artifacts/practice-playability/
          retention-days: 7
