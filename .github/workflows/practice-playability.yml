name: Practice Playability Repair
on:
  push:
    branches: [main, fix/practice-lab-playability]
    paths: ['js/practiceLab/**', 'tests/browser/practice_*.mjs', 'tests/practice-*.test.js', 'scripts/auditPracticePrivacySecurity.mjs', 'practiceLab*.css', 'index.html', 'sw.js', '.github/workflows/practice-playability.yml']
  pull_request:
    paths: ['js/practiceLab/**', 'tests/browser/practice_*.mjs', 'tests/practice-*.test.js', 'scripts/auditPracticePrivacySecurity.mjs', 'practiceLab*.css', 'index.html', 'sw.js', '.github/workflows/practice-playability.yml']
permissions:
  contents: read
concurrency:
  group: practice-repair-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p browser-artifacts/release-core
          npm test > browser-artifacts/release-core/unit.log 2>&1
          node scripts/validatePracticeReleaseContent.mjs > browser-artifacts/release-core/content.json
          node scripts/auditPracticePrivacySecurity.mjs > browser-artifacts/release-core/security.json
          node scripts/testPracticeMigrations.mjs > browser-artifacts/release-core/migrations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-core-results
          path: browser-artifacts/release-core/
          retention-days: 7
  public-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            width: 1280
          - browser: firefox
            width: 1280
          - browser: webkit
            width: 390
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root
      PRACTICE_BROWSERS: ${{ matrix.browser }}
      PRACTICE_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.57.0
      - name: Complete public sessions and verify saved results
        run: node tests/browser/practice_end_to_end.mjs
      - name: Continuous physical keyboard regression
        if: ${{ !cancelled() && matrix.browser != 'webkit' }}
        run: node tests/browser/practice_playability.mjs
      - name: Weak Keys alphabet readiness under saturated localStorage
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        run: node tests/browser/practice_weak_keys_alphabet.mjs
      - name: Weakness Boss stable typing capture
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        run: node tests/browser/practice_boss_input.mjs
      - name: Assessment and protected protocol regression
        if: ${{ !cancelled() }}
        run: node tests/browser/practice_completion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-evidence-${{ matrix.browser }}-${{ matrix.width }}
          path: browser-artifacts/
          retention-days: 7
