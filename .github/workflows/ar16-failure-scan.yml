name: AR16 Full Failure Scan

on:
  push:
    branches:
      - feature/arcade-rush-ar16-delete-daily-frontend

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run every test and report all failures
        shell: bash
        run: |
          set +e
          failures=0
          for file in $(find tests -maxdepth 1 -name '*.test.js' -printf '%f\n' | sort); do
            node "tests/$file"
            code=$?
            if [ $code -ne 0 ]; then
              echo "AR16_SCAN_FAILURE:$file"
              failures=1
            fi
          done
          exit $failures
