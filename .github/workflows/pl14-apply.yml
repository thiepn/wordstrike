name: PL14 integration gate

on:
  push:
    branches:
      - codex/pl14-performance-state-frontier
    paths:
      - scripts/pl14_apply.py
      - scripts/pl14_fix1.py
      - scripts/pl14_fix2.py
      - scripts/pl14_fix3.py
      - scripts/pl14_fix4.py
      - scripts/pl14_fix5.py
      - tests/practice-ability-session-repository.test.js
      - .github/workflows/pl14-apply.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl14-performance-state-frontier
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply PL14 integration
        run: |
          python scripts/pl14_apply.py
          python scripts/pl14_fix1.py
          python scripts/pl14_fix2.py
          python scripts/pl14_fix3.py
          python scripts/pl14_fix4.py
          python scripts/pl14_fix5.py
      - name: Run focused PL14 and compatibility gates
        run: |
          node tests/practice-performance-state.test.js
          node tests/practice-control-frontier.test.js
          node tests/practice-performance-storage-repository.test.js
          node tests/practice-performance-contract-isolation.test.js
          node tests/practice-ability-observation.test.js
          node tests/practice-ability-session-repository.test.js
          node tests/practice-ability-storage-migration.test.js
          node tests/practice-context-identity.test.js
          node tests/practice-corpus-isolation.test.js
          node tests/practice-error-foundation.test.js
          node tests/practice-error-migration-validation.test.js
          node tests/practice-error-session-integration.test.js
          node tests/practice-foundation-contract.test.js
          node tests/practice-latency-migration-validation.test.js
          node tests/practice-latency-session-integration.test.js
          node tests/practice-limiter-service-isolation.test.js
          node tests/practice-normalization-migration-validation.test.js
          node tests/practice-normalization-session-integration.test.js
          node tests/practice-profile-migration.test.js
          node tests/practice-schema-defaults.test.js
          node tests/practice-skill-evidence-session-repository.test.js
      - name: Run full regression suite
        run: npm test
      - name: Commit clean PL14 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PL14: add performance state readiness and control frontier"
          git push origin HEAD:codex/pl14-performance-state-frontier
