name: Release integration merge

on:
  push:
    branches: [release/practice-lab-through-pl29]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: practice-pl29-release-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main with known workflow resolutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "thiepn"
          git config user.email "junsosmart@gmail.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf '%s\n' "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^\.github/workflows/(non-practice-browser|typing-browser)\.yml$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected integration conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            git checkout --ours .github/workflows/non-practice-browser.yml .github/workflows/typing-browser.yml
            git add .github/workflows/non-practice-browser.yml .github/workflows/typing-browser.yml
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git rm .github/workflows/release-integration-probe.yml
          git commit -m "chore(release): integrate current main with Practice Lab through PL29"
          git push origin HEAD:release/practice-lab-through-pl29
