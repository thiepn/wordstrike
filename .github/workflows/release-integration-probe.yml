name: Release integration merge

on:
  push:
    branches: [release/practice-lab-through-pl29]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: practice-pl29-release-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "thiepn"
          git config user.email "junsosmart@gmail.com"
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            echo "CONFLICTS_BEGIN"
            git diff --name-only --diff-filter=U
            echo "CONFLICTS_END"
            exit 1
          fi
          git rm .github/workflows/release-integration-probe.yml
          git commit -m "chore(release): integrate current main with Practice Lab through PL29"
          git push origin HEAD:release/practice-lab-through-pl29
