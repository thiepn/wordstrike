name: Customization P3 release certification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install -r tests/browser/requirements.txt
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          python -m playwright install --with-deps chromium firefox
      - name: Certify integrated customization release
        run: python tests/browser/customization_p3_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customization-p3-release-evidence
          path: browser-artifacts/customization-p3-release/
          retention-days: 14
