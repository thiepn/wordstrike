name: PL26 build Pace Ladder forms

on:
  push:
    branches:
      - codex/pl26-pace-ladder-v1

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Pace Ladder forms
        run: node scripts/buildPracticePaceLadderForms.mjs
      - name: Report Pace Ladder form diagnostics
        run: cat data/practice/pace-ladder/en-v1/WS-PACE-EN-1.manifest.json
      - name: Validate Pace Ladder forms
        run: node scripts/buildPracticePaceLadderForms.mjs --validate
      - name: Commit generated form artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/practice/pace-ladder/en-v1/WS-PACE-EN-1.forms.json data/practice/pace-ladder/en-v1/WS-PACE-EN-1.manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'PL26: build Pace Ladder forms'
          git push
