name: UI2 materialize
on:
  push:
    branches: [feat/ui2-title-global-navigation]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui2-title-global-navigation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply UI2 migration
        run: python tools/apply_ui2.py
      - name: Run canonical tests
        run: npm test
      - name: Commit verified UI2 source migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui.js index.html style.css styles/ui-system.css .github/workflows/non-practice-browser.yml
          git diff --cached --quiet && exit 0
          git commit -m "UI2: migrate Title screen onto cyber-athletic navigation"
          git push origin HEAD:feat/ui2-title-global-navigation
