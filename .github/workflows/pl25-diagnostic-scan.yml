name: PL25 bounded diagnostic scan

on:
  push:
    branches:
      - codex/pl25-daily-coach-v1

permissions:
  contents: write

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl25-daily-coach-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run bounded diagnostics
        shell: bash
        run: |
          set +e
          npm test > /tmp/pl25-test.log 2>&1
          test_status=$?
          set -e
          {
            echo "TEST_STATUS=$test_status"
            echo
            echo "=== FIRST FAILURE ==="
            grep -n -m1 -A35 -E '^not ok |Test failed:|Expected values to be strictly' /tmp/pl25-test.log || true
            echo
            echo "=== OLD ENVELOPE REFERENCES ==="
            grep -R -n -E 'PRACTICE_DATABASE_VERSION[^\n]*, *7\)|PRACTICE_RECORD_VERSIONS\.sessionSummary[^\n]*, *12\)|recordVersion[^\n]*, *12\)' tests || true
            echo
            echo "=== FINAL TEST SUMMARY ==="
            tail -n 25 /tmp/pl25-test.log
          } > PL25_DIAGNOSTIC.txt
          rm .github/workflows/pl25-diagnostic-scan.yml
      - name: Commit bounded diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PL25: capture bounded test diagnostic"
          git push origin HEAD:codex/pl25-daily-coach-v1
