name: PL26 refresh PL19 diagnostic artifact

on:
  push:
    branches:
      - codex/pl26-pace-ladder-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild dependent PL19 diagnostic artifact
        run: node scripts/buildPracticeAssessmentDiagnostics.mjs
      - name: Validate regenerated artifact
        run: node scripts/buildPracticeAssessmentDiagnostics.mjs --validate
      - name: Commit generated artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/practice/assessment/en-v1/diagnostic-forms-v1.manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'PL26: refresh PL19 diagnostic artifact'
          git push
