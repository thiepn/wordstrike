name: PL23 temporary integration verifier
on:
  push:
    branches: [codex/pl23-accuracy-recovery]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.head_commit.message != 'PL23 apply shared integration patches'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl23-accuracy-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrow PL23 integration patches
        run: |
          python - <<'PY'
          from pathlib import Path

          # PL11: use one canonical primary-error attribution helper and expose compact attribution.
          p = Path('js/practiceLab/practiceSkillEvidenceCollector.js')
          s = p.read_text()
          marker = 'import { createPracticeTransitionContextResolver } from "./practiceContextFeatures.js";\n'
          if 'practicePrimaryErrorAttribution.js' not in s:
              s = s.replace(marker, marker + 'import { resolvePracticePrimaryErrorAttribution } from "./practicePrimaryErrorAttribution.js";\n')
          old = '''    let position = Number.isInteger(episode.primaryPosition) ? episode.primaryPosition : episode.startPosition;\n    if (episode.editClass === "transposition" && ["high", "medium"].includes(episode.confidence) && Number.isInteger(episode.affectedStart) && Number.isInteger(episode.affectedEnd) && episode.affectedEnd > episode.affectedStart) position = episode.affectedStart + 1;\n    if (!Number.isInteger(position) || position < 0) return false;\n    for (const entity of entityResolver.resolveAtPosition(position)) {'''
          new = '''    const attribution = resolvePracticePrimaryErrorAttribution({ episode, entityResolver });\n    if (!attribution.length) return false;\n    for (const entity of attribution) {'''
          if old not in s and new not in s: raise SystemExit('PL11 attribution block not found')
          s = s.replace(old, new)
          return_marker = '  return Object.freeze({\n    recordInsertion,\n    recordClosedEpisode,\n'
          replacement = '  return Object.freeze({\n    recordInsertion,\n    resolveClosedEpisodeAttribution(episode) { return resolvePracticePrimaryErrorAttribution({ episode, entityResolver }); },\n    recordClosedEpisode,\n'
          if replacement not in s:
              if return_marker not in s: raise SystemExit('PL11 return surface not found')
              s = s.replace(return_marker, replacement)
          p.write_text(s)

          # Shared engine: notify experiment only after a closed PL9 episode, using compact PL11 attribution.
          p = Path('js/practiceLab/practiceSessionEngineLegacy.js')
          s = p.read_text()
          emit_marker = '''  const emit = (event) => {\n    snapshotVersion += 1;\n    const snapshot = immutableSnapshot();\n    for (const listener of [...subscribers]) {\n      try { listener(snapshot, event); } catch (cause) { logger?.warn?.("Practice subscriber failed", { event, cause }); }\n    }\n    return snapshot;\n  };\n'''
          helper = '''\n  const processClosedErrorEpisode = (episode) => {\n    const attribution = skillEvidenceTracker?.resolveClosedEpisodeAttribution?.(episode) ?? [];\n    skillEvidenceTracker?.recordClosedEpisode(episode);\n    if (typeof experiment?.onClosedErrorEpisode === "function") {\n      try {\n        const feedback = experiment.onClosedErrorEpisode(freezeDeep({ episode: clonePracticeValue(episode), attribution }));\n        if (feedback) emit("repair-feedback");\n      } catch (cause) { logger?.warn?.("Practice closed-error experiment callback failed", { cause }); }\n    }\n  };\n'''
          if 'const processClosedErrorEpisode' not in s:
              if emit_marker not in s: raise SystemExit('engine emit marker not found')
              s = s.replace(emit_marker, emit_marker + helper)
          s = s.replace('for (const episode of errorTracker.drainClosedEpisodes()) skillEvidenceTracker.recordClosedEpisode(episode);', 'for (const episode of errorTracker.drainClosedEpisodes()) processClosedErrorEpisode(episode);')
          p.write_text(s)

          # Trusted evidence role.
          p = Path('js/practiceLab/practiceEvidenceRole.js')
          s = p.read_text()
          if 'practiceAccuracyRecoveryTrust.js' not in s:
              s = s.replace('import { getPracticeTrustedProblemWordsBinding } from "./practiceProblemWordsTrust.js";\n', 'import { getPracticeTrustedProblemWordsBinding } from "./practiceProblemWordsTrust.js";\nimport { getPracticeTrustedAccuracyRecoveryBinding } from "./practiceAccuracyRecoveryTrust.js";\n')
          resolver = 'function resolveTrustedAccuracyRecovery(contentPlan) { const binding = getPracticeTrustedAccuracyRecoveryBinding(contentPlan); if (!binding || binding.experimentId !== "accuracy-control" || binding.partition !== "training" || binding.evidenceRole !== "training" || !["key", "bigram", "trigram", "word"].includes(binding.target?.entityType) || !binding.target?.entityKey) return null; return "training"; }\n'
          if 'resolveTrustedAccuracyRecovery' not in s:
              s = s.replace('function resolveTrustedProblemWords(contentPlan)', resolver + 'function resolveTrustedProblemWords(contentPlan)')
          old = '  const problemWordsRole = resolveTrustedProblemWords(contentPlan); if (problemWordsRole) return problemWordsRole;\n'
          new = old + '  const accuracyRecoveryRole = resolveTrustedAccuracyRecovery(contentPlan); if (accuracyRecoveryRole) return accuracyRecoveryRole;\n'
          if 'const accuracyRecoveryRole' not in s:
              if old not in s: raise SystemExit('evidence role insertion point not found')
              s = s.replace(old, new)
          p.write_text(s)

          # PL16: allow trusted PL23 Baseline/Check bounds without changing generic fallback.
          p = Path('js/practiceLab/practiceLearningObservation.js')
          s = p.read_text()
          if 'practiceAccuracyRecoveryTrust.js' not in s:
              s = s.replace('import { getPracticeTrustedProblemWordsBinding } from "./practiceProblemWordsTrust.js";\n', 'import { getPracticeTrustedProblemWordsBinding } from "./practiceProblemWordsTrust.js";\nimport { getPracticeTrustedAccuracyRecoveryBinding } from "./practiceAccuracyRecoveryTrust.js";\n')
          old_fn = '''function trustedInterventionMetadata(contentPlan) {\n  if (getPracticeTrustedCombinationRepairBinding(contentPlan)) return contentPlan?.metadata?.combinationRepair ?? null;\n  if (getPracticeTrustedWeakKeysBinding(contentPlan)) return contentPlan?.metadata?.weakKeys ?? null;\n  if (getPracticeTrustedProblemWordsBinding(contentPlan)) return contentPlan?.metadata?.problemWords ?? null;\n  return null;\n}\n\nexport function resolvePracticeTrustedLearningPhaseBounds(contentPlan) {\n  const metadata = trustedInterventionMetadata(contentPlan);\n  if (!metadata) return null;\n  const ranges = Array.isArray(metadata.phaseRanges) ? metadata.phaseRanges : [];\n  const entry = ranges.find((range) => range?.id === "entry-probe") ?? null;\n  const exit = ranges.find((range) => range?.id === "exit-probe") ?? null;\n'''
          new_fn = '''function trustedInterventionMetadata(contentPlan) {\n  if (getPracticeTrustedCombinationRepairBinding(contentPlan)) return { metadata: contentPlan?.metadata?.combinationRepair ?? null, entryId: "entry-probe", exitId: "exit-probe" };\n  if (getPracticeTrustedWeakKeysBinding(contentPlan)) return { metadata: contentPlan?.metadata?.weakKeys ?? null, entryId: "entry-probe", exitId: "exit-probe" };\n  if (getPracticeTrustedProblemWordsBinding(contentPlan)) return { metadata: contentPlan?.metadata?.problemWords ?? null, entryId: "entry-probe", exitId: "exit-probe" };\n  if (getPracticeTrustedAccuracyRecoveryBinding(contentPlan)) return { metadata: contentPlan?.metadata?.accuracyRecovery ?? null, entryId: "baseline", exitId: "check" };\n  return null;\n}\n\nexport function resolvePracticeTrustedLearningPhaseBounds(contentPlan) {\n  const trusted = trustedInterventionMetadata(contentPlan);\n  if (!trusted?.metadata) return null;\n  const ranges = Array.isArray(trusted.metadata.phaseRanges) ? trusted.metadata.phaseRanges : [];\n  const entry = ranges.find((range) => range?.id === trusted.entryId) ?? null;\n  const exit = ranges.find((range) => range?.id === trusted.exitId) ?? null;\n'''
          if old_fn in s: s = s.replace(old_fn, new_fn)
          elif new_fn not in s: raise SystemExit('learning phase trust block not found')
          s = s.replace('entry: { phaseId: "entry-probe", startIndex: entry.startIndex, endIndex: entry.endIndex },\n    exit: { phaseId: "exit-probe", startIndex: exit.startIndex, endIndex: exit.endIndex },', 'entry: { phaseId: trusted.entryId, startIndex: entry.startIndex, endIndex: entry.endIndex },\n    exit: { phaseId: trusted.exitId, startIndex: exit.startIndex, endIndex: exit.endIndex },')
          p.write_text(s)

          # Catalog: reuse existing stable accuracy-control ID.
          p = Path('js/practiceLab/practiceExperimentCatalog.js')
          s = p.read_text()
          old = '["accuracy-control", "Accuracy Control", "Accuracy", "precision", "Build control at a sustainable error rate.", "Pacing and correction constraints will help you value clean execution before adding more speed.", 2, 4, 6, "all-levels", false, false, 11, 40, "target", "precision", "accuracy control"]'
          new = '["accuracy-control", "Accuracy & Recovery", "Accuracy", "precision", "Practice clean first-pass typing and more precise recovery when errors occur, without chasing an artificially slow perfect score.", "Train one canonical key, combination, or word through Baseline, Control, Repair, Mix, and Check. Natural errors remain optional observations: correction is allowed, never forced, and repair feedback appears only after real target-attributed episodes close.", 4, 5, 6, "adaptive", false, false, 11, 40, "target", "precision", "first-pass control and recovery"]'
          if old in s: s = s.replace(old, new)
          elif new not in s: raise SystemExit('catalog accuracy row not found')
          s = s.replace('["full-assessment", "weak-keys", "combination-repair", "problem-words"].includes(id)', '["full-assessment", "weak-keys", "combination-repair", "problem-words", "accuracy-control"].includes(id)')
          s = s.replace('["weak-keys", "combination-repair", "problem-words"].includes(id)', '["weak-keys", "combination-repair", "problem-words", "accuracy-control"].includes(id)')
          p.write_text(s)

          # V23 controller renderer fallback import.
          p = Path('js/practiceLab/practiceLabControllerRuntimeV23.js')
          s = p.read_text().replace('import { renderPracticeLabV22 } from "./practiceLabRendererV22.js";\nimport { renderPracticeAccuracyRecoveryDetail } from "./practiceLabRendererV23.js";', 'import { renderPracticeAccuracyRecoveryDetail, renderPracticeLabV23 } from "./practiceLabRendererV23.js";')
          s = s.replace('renderPracticeLabV22(renderRoot, view, rendererOptions)', 'renderPracticeLabV23(renderRoot, view, rendererOptions)')
          p.write_text(s)

          # Lazy shell: preserve canonical entrypoint while using V23 wrapper.
          p = Path('js/practiceLab/practiceLabController.js')
          s = p.read_text()
          s = s.replace('await import("./practiceLabControllerRuntimeV22.js")', 'await import("./practiceLabControllerRuntimeV23.js")', 1)
          old_imports = '''      import("./practiceLabControllerRuntime.js"),\n      import("./practiceLabControllerRuntimeV22.js"),\n      import("./practiceCombinationRepairExperiment.js"),\n      import("./practiceWeakKeysExperiment.js"),\n      import("./practiceProblemWordsExperiment.js"),\n    ]).then(([registryModule, _canonicalControllerModule, controllerModule, combinationRepairModule, weakKeysModule, problemWordsModule]) => {'''
          new_imports = '''      import("./practiceLabControllerRuntime.js"),\n      import("./practiceLabControllerRuntimeV22.js"),\n      import("./practiceLabControllerRuntimeV23.js"),\n      import("./practiceCombinationRepairExperiment.js"),\n      import("./practiceWeakKeysExperiment.js"),\n      import("./practiceProblemWordsExperiment.js"),\n      import("./practiceAccuracyRecoveryExperiment.js"),\n    ]).then(([registryModule, _canonicalControllerModule, _v22ControllerModule, controllerModule, combinationRepairModule, weakKeysModule, problemWordsModule, accuracyRecoveryModule]) => {'''
          if old_imports in s: s = s.replace(old_imports, new_imports)
          elif new_imports not in s: raise SystemExit('lazy controller import block not found')
          old_register = '      problemWordsModule.registerPracticeProblemWordsExperiment(resolvedRegistry);\n'
          if 'accuracyRecoveryModule.registerPracticeAccuracyRecoveryExperiment' not in s: s = s.replace(old_register, old_register + '      accuracyRecoveryModule.registerPracticeAccuracyRecoveryExperiment(resolvedRegistry);\n')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/practiceLab
          if ! git diff --cached --quiet; then
            git commit -m 'PL23 apply shared integration patches'
            git push origin HEAD:codex/pl23-accuracy-recovery
          fi
      - name: Run full suite
        run: npm test
