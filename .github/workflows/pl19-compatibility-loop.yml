name: PL19 Failure-Driven Compatibility

on:
  push:
    branches:
      - codex/pl19-full-assessment

permissions:
  contents: write

jobs:
  repair-legacy-wrappers:
    if: ${{ !contains(github.event.head_commit.message, '[pl19-compatibility-loop]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/pl19-full-assessment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair only first failing legacy structural wrapper until green
        run: node scripts/pl19CompatibilityLoop.mjs
      - name: Verify diff
        run: git diff --check
      - name: Commit green compatibility envelope and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Suite already green; no compatibility commit required."
            exit 0
          fi
          git commit -m "PL19: certify compatibility envelope [pl19-compatibility-loop]"
          git push origin HEAD:codex/pl19-full-assessment
