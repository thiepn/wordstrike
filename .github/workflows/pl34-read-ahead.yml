name: PL34 Read-Ahead

on:
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PL34 Read-Ahead certification
        run: npm run test:pl34-read-ahead
      - name: Full WordStrike regression suite
        run: npm test
