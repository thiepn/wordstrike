name: Account repair candidate validation
on:
  push:
    branches: [fix/account-progress-reliability]
    paths: ['.repair/**', '.github/workflows/account-repair-validation.yml']
permissions:
  contents: write
concurrency:
  group: wordstrike-account-repair
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct exact reviewed candidate
        id: prepare
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,lzma,os,subprocess
          from pathlib import Path
          root=Path.cwd(); manifest=json.loads((root/'.repair/manifest.json').read_text())
          patch=lzma.decompress(b''.join((root/f'.repair/part-{i}.xz').read_bytes() for i in range(5)))
          assert hashlib.sha256(patch).hexdigest()==manifest['sha256'], 'Patch checksum mismatch'
          source=Path(os.environ['RUNNER_TEMP'])/'wordstrike-source'
          subprocess.run(['git','worktree','add','--detach',str(source),manifest['base']],check=True)
          patchfile=Path(os.environ['RUNNER_TEMP'])/'repair.patch';patchfile.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(patchfile)],cwd=source,check=True)
          subprocess.run(['git','apply',str(patchfile)],cwd=source,check=True)
          followup=root/'.repair/followup.patch'
          if followup.exists():
            subprocess.run(['git','apply','--check',str(followup)],cwd=source,check=True)
            subprocess.run(['git','apply',str(followup)],cwd=source,check=True)
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write(f'SOURCE={source}\n')
          PY
      - name: Vendor pinned SDK and install browser test tools
        id: tools
        run: |
          cd "$SOURCE"
          node scripts/vendorSupabase.mjs
          pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium firefox
      - name: Full existing and new JavaScript suite
        id: unit
        run: |
          set -o pipefail
          cd "$SOURCE"
          mkdir -p browser-artifacts
          npm test 2>&1 | tee browser-artifacts/unit-tests.log
      - name: Account, persistence, scroll and feedback browser regressions
        id: browser
        if: always() && steps.tools.outcome == 'success'
        run: |
          set -o pipefail
          cd "$SOURCE"
          python tests/browser/account_progress_reliability.py 2>&1 | tee browser-artifacts/account-browser.log
      - name: Existing Campaign browser regressions
        id: campaign
        if: always() && steps.tools.outcome == 'success'
        run: |
          set -o pipefail
          cd "$SOURCE"
          python tests/browser/campaign_recovery.py 2>&1 | tee browser-artifacts/campaign-browser.log
      - name: Existing cross-mode browser regressions
        id: modes
        if: always() && steps.tools.outcome == 'success'
        run: |
          set -o pipefail
          cd "$SOURCE"
          python tests/browser/non_practice_regressions.py 2>&1 | tee browser-artifacts/modes-browser.log
      - name: Package complete source and test evidence
        if: always() && steps.prepare.outcome == 'success'
        run: |
          mkdir -p evidence
          cp -R "$SOURCE/browser-artifacts" evidence/ || true
          tar --exclude=.git --exclude=browser-artifacts --exclude=__pycache__ -czf evidence/validated-source.tar.gz -C "$SOURCE" .
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: account-repair-evidence
          path: evidence/
          retention-days: 7
      - name: Publish candidate only after all checks pass
        if: success() && steps.unit.outcome == 'success' && steps.browser.outcome == 'success' && steps.campaign.outcome == 'success' && steps.modes.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json,os,shutil,subprocess
          from pathlib import Path
          root=Path.cwd();source=Path(os.environ['SOURCE']);manifest=json.loads((root/'.repair/manifest.json').read_text())
          paths=manifest['paths']+['vendor/supabase-2.116.0.js','vendor/supabase-LICENSE.txt','vendor/supabase-2.116.0.integrity.json']
          for name in paths:
            p=Path(name)
            assert not p.is_absolute() and '..' not in p.parts and p.parts[0] not in ['.github','.git','.repair']
            target=root/p;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source/p,target)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix: persist account progress, stabilize scrolling and restore typing feedback'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/fix/account-progress-reliability'],check=True)
          PY
