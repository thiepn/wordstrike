name: PL13 Doc Append

on:
  push:
    branches: [codex/pl13-ability-estimator-uncertainty]

permissions:
  contents: write

jobs:
  append-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl13-ability-estimator-uncertainty
          fetch-depth: 0
      - name: Append PL13 typability downstream contract
        env:
          APPEND_B64: 
        run: |
          if ! grep -q '^## 29. PL13 observation-level ability adjustment$' docs/PRACTICE_LAB_CONTEXT_TYPABILITY_MODEL.md; then
            printf '\n' >> docs/PRACTICE_LAB_CONTEXT_TYPABILITY_MODEL.md
            printf '%s' "$APPEND_B64" | base64 -d >> docs/PRACTICE_LAB_CONTEXT_TYPABILITY_MODEL.md
          fi
          git diff --check
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRACTICE_LAB_CONTEXT_TYPABILITY_MODEL.md
          git commit -m "docs(practice): add PL13 typability adjustment contract" || true
          git push origin HEAD:codex/pl13-ability-estimator-uncertainty
