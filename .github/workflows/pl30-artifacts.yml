name: PL30 Punctuation, Capitals, Numbers, and Symbols

on:
  pull_request:
  push:
    branches: [codex/pl30-punctuation-numbers-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deterministic PL30 form artifacts
        run: npm run validate:practice-special-domains
      - name: Run PL30 certification
        run: npm run test:pl30-special-domains
      - name: Ensure builders are read-only under validation
        run: git diff --exit-code
