name: Fix Campaign Checkpoint Access V2

on:
  push:
    branches:
      - fix/campaign-checkpoint-access

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/campaign-checkpoint-access
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact checkpoint access model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          storage = Path("js/storage.js")
          s = storage.read_text()
          anchor = '''export function getCampaignSpeedUnlockLevel() {
            return getCampaignSpeedUnlockLevelFromWpm(getCampaignBest60SecondWpm());
          }
          '''
          helpers = anchor + '''
          function normalizeCampaignLevel(value) {
            return Math.max(1, Math.min(100, Math.trunc(Number(value) || 1)));
          }

          function hasClearedCampaignLevel(save, levelNumber) {
            const level = normalizeCampaignLevel(levelNumber);
            const record = save?.levels?.[String(level)] ?? save?.levels?.[level];
            return Boolean(record?.grade && record.grade !== "Fail");
          }

          function isCampaignSpeedCheckpointUnlocked(levelNumber, speedUnlockLevel) {
            const level = normalizeCampaignLevel(levelNumber);
            const speedLevel = normalizeCampaignLevel(speedUnlockLevel);
            return CAMPAIGN_SPEED_UNLOCKS.some(
              (checkpoint) => checkpoint.level === level && checkpoint.level <= speedLevel,
            );
          }

          export function isCampaignLevelAccessible(
            save,
            levelNumber,
            speedUnlockLevel = getCampaignSpeedUnlockLevel(),
          ) {
            const targetLevel = normalizeCampaignLevel(levelNumber);
            if (targetLevel === 1) return true;

            let previousAccessible = true;
            for (let level = 2; level <= targetLevel; level += 1) {
              const checkpointAccessible = isCampaignSpeedCheckpointUnlocked(level, speedUnlockLevel);
              const sequentiallyAccessible = previousAccessible && hasClearedCampaignLevel(save, level - 1);
              const accessible = checkpointAccessible || sequentiallyAccessible;
              if (level === targetLevel) return accessible;
              previousAccessible = accessible;
            }
            return false;
          }

          export function getHighestCampaignAccessibleLevel(
            save,
            speedUnlockLevel = getCampaignSpeedUnlockLevel(),
          ) {
            let highest = 1;
            for (let level = 2; level <= 100; level += 1) {
              if (isCampaignLevelAccessible(save, level, speedUnlockLevel)) highest = level;
            }
            return highest;
          }
          '''
          s = once(s, anchor, helpers, "storage helpers")
          s = once(s,
              'return Math.max(progressLevel, getCampaignSpeedUnlockLevel());',
              'return getHighestCampaignAccessibleLevel(save);',
              "highest accessible getter")
          storage.write_text(s)

          main = Path("js/main.js")
          s = main.read_text()
          s = once(s, '  canLaunchLevel,\n', '', "remove scalar access import")
          s = once(s, '  loadSave,\n', '  isCampaignLevelAccessible,\n  loadSave,\n', "add exact access import")
          s = once(s,
              '  const legitimatelyUnlocked = safeLevel <= appState.save.currentFurthestLevel;\n  if (!canLaunchLevel(appState.devMode, appState.save.currentFurthestLevel, safeLevel)) return;',
              '  const legitimatelyUnlocked = isCampaignLevelAccessible(appState.save, safeLevel);\n  if (!appState.devMode && !legitimatelyUnlocked) return;',
              "launch authority")
          main.write_text(s)

          ui = Path("js/ui.js")
          s = ui.read_text()
          s = once(s,
              'import { getCampaignDifficultyLevel } from "./campaignDifficulty.js";\n',
              'import { getCampaignDifficultyLevel } from "./campaignDifficulty.js";\nimport { isCampaignLevelAccessible } from "./storage.js";\n',
              "ui exact access import")
          s = once(s,
              '  const selectedLocked = !devMode && safeSelected > furthestLevel;',
              '  const selectedLocked = !devMode && !isCampaignLevelAccessible(save, safeSelected);',
              "selected access")
          s = once(s,
              '    const sectorLocked = !devMode && firstLevel > furthestLevel;',
              '    const sectorLocked = !devMode && sectorLevels.every(\n      (level) => !isCampaignLevelAccessible(save, level),\n    );',
              "sector access")
          s = once(s,
              '      const locked = !devMode && level > furthestLevel;',
              '      const locked = !devMode && !isCampaignLevelAccessible(save, level);',
              "node access")
          s = once(s,
              '<div class="campaign-progress-count">UNLOCKED <strong>${devMode ? 100 : furthestLevel}</strong><span>/ 100</span></div>',
              '<div class="campaign-progress-count">HIGHEST ACCESS <strong>${devMode ? 100 : furthestLevel}</strong><span>/ 100</span></div>',
              "access copy")
          ui.write_text(s)
          PY

          cat > tests/campaign-checkpoint-access.test.js <<'EOF'
          import assert from "node:assert/strict";
          import {
            createDefaultSave,
            isCampaignLevelAccessible,
            updateLevelResult,
          } from "../js/storage.js";

          const pass = {
            grade: "A",
            accuracy: 95,
            wpm: 60,
            score: 1000,
            maxCombo: 10,
            timeRemaining: 5,
          };

          {
            const save = createDefaultSave();
            const accessible = Array.from({ length: 31 }, (_, index) => index + 1)
              .filter((level) => isCampaignLevelAccessible(save, level, 31));
            assert.deepEqual(accessible, [1, 11, 21, 31]);
          }

          {
            const save = createDefaultSave();
            updateLevelResult(save, 31, pass);
            assert.equal(isCampaignLevelAccessible(save, 32, 31), true);
            assert.equal(isCampaignLevelAccessible(save, 22, 31), false);
            assert.equal(isCampaignLevelAccessible(save, 30, 31), false);
            updateLevelResult(save, 32, pass);
            assert.equal(isCampaignLevelAccessible(save, 33, 31), true);
            assert.equal(isCampaignLevelAccessible(save, 34, 31), false);
          }

          {
            const save = createDefaultSave();
            updateLevelResult(save, 21, pass);
            assert.equal(isCampaignLevelAccessible(save, 22, 31), true);
            assert.equal(isCampaignLevelAccessible(save, 23, 31), false);
          }

          {
            const save = createDefaultSave();
            updateLevelResult(save, 25, pass);
            assert.equal(isCampaignLevelAccessible(save, 26, 31), false);
          }

          {
            const save = createDefaultSave();
            updateLevelResult(save, 1, pass);
            assert.equal(isCampaignLevelAccessible(save, 2, 1), true);
            assert.equal(isCampaignLevelAccessible(save, 3, 1), false);
          }

          console.log("Campaign checkpoint-only access and sequential continuation tests passed.");
          EOF

      - name: Run full test suite
        run: npm test
      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-campaign-checkpoint-access.yml
          git rm .github/workflows/fix-campaign-checkpoint-access-v2.yml
          git add js/storage.js js/main.js js/ui.js tests/campaign-checkpoint-access.test.js
          git commit -m "Fix Campaign checkpoint-only speed access"
          git push origin HEAD:fix/campaign-checkpoint-access
