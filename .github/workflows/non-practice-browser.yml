name: Non-Practice browser regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium firefox
      - name: Exercise active WordStrike surfaces except Practice Lab
        run: python tests/browser/non_practice_regressions.py
      - name: Certify UI1 design-system and responsive contracts
        run: python tests/browser/ui1_design_system.py
      - name: Certify UI2 Title and global navigation
        run: python tests/browser/ui2_title_navigation.py
      - name: Certify UI3 Mode Select
        run: python tests/browser/ui3_mode_select.py
      - name: Certify UI4 Campaign progression
        run: python tests/browser/ui4_campaign_progression.py
      - name: Certify UI5 Campaign gameplay
        run: |
          python tests/browser/ui5_campaign_gameplay.py
          python tests/browser/ui5_campaign_visual.py
      - name: Certify UI6 Endless gameplay
        run: |
          python tests/browser/ui6_endless_gameplay.py
          python tests/browser/ui6_endless_visual.py
      - name: Certify UI7 Boss cinematic gameplay
        run: |
          python tests/browser/ui7_boss_gameplay.py
          python tests/browser/ui7_boss_visual.py
      - name: Certify UI9 Arcade Rush unified gameplay
        run: python tests/browser/ui9_arcade_rush.py
      - name: Certify UI10 shared Results, Pause, and onboarding
        run: python tests/browser/ui10_results_pause_onboarding.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: non-practice-browser-evidence
          path: |
            browser-artifacts/non-practice/
            browser-artifacts/ui1-design-system/
            browser-artifacts/ui2-title-navigation/
            browser-artifacts/ui3-mode-select/
            browser-artifacts/ui4-campaign-progression/
            browser-artifacts/ui5-campaign-gameplay/
            browser-artifacts/ui6-endless-gameplay/
            browser-artifacts/ui7-boss-gameplay/
            browser-artifacts/ui9-arcade-rush/
            browser-artifacts/ui10-results-pause-onboarding/
          retention-days: 7
