name: PL23 documentation finalizer
on:
  push:
    branches:
      - codex/pl23-accuracy-recovery
permissions:
  contents: write
jobs:
  append-docs:
    if: github.event.head_commit.message != 'PL23 append canonical documentation addenda'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl23-accuracy-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Append PL23 documentation addenda
        run: python scripts/pl23AppendDocs.py
      - name: Commit PL23 documentation addenda
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PRACTICE_LAB_ERROR_RECOVERY_MODEL.md docs/PRACTICE_LAB_LEARNING_CURVES_AND_SATURATION.md docs/PRACTICE_LAB_LIMITER_IMPACT_MODEL.md docs/PRACTICE_LAB_SESSION_ENGINE.md
          git commit -m 'PL23 append canonical documentation addenda'
          git push origin HEAD:codex/pl23-accuracy-recovery
