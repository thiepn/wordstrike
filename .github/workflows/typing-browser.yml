name: Typing browser regressions
on:
  pull_request:
  push:
    branches: [main, codex/pl28-common-words-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Keep this version aligned with tests/browser/requirements.txt.
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
      options: --ipc=host
    env:
      # Firefox requires HOME to be owned by the container's current user.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: python3 -m pip install -r tests/browser/requirements.txt
      - name: Exercise real Typing Test UI in Chromium and Firefox
        run: python3 tests/browser/typing_regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typing-browser-evidence
          path: browser-artifacts/
          retention-days: 7
