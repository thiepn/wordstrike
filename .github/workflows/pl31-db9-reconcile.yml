name: PL31 DB9 test reconciliation

on:
  push:
    branches: [pl31-custom-text]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    if: "${{ !contains(github.event.head_commit.message, 'PL31: reconcile historical DB9 test expectations') }}"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile only stale DB8 envelope assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'assert.equal(PRACTICE_DATABASE_VERSION, 8);': 'assert.equal(PRACTICE_DATABASE_VERSION, 9);',
              'PL18 evaluationStates remain structurally unchanged inside the PL25 DB8 envelope': 'PL18 evaluationStates remain structurally unchanged inside the PL31 DB9 envelope',
              'PL28 keeps database and generic record schemas unchanged': 'PL28 generic record schemas remain stable inside the PL31 DB9 envelope',
              'PL29 keeps generic persistence and foundation versions unchanged': 'PL29 generic record and foundation versions remain stable inside the PL31 DB9 envelope',
              'PL30 prerequisite channels exist and persistent envelope does not change': 'PL30 prerequisite channels and record versions remain stable inside the PL31 DB9 envelope',
              'PL25 DB8 schema descriptors passed.': 'PL31 DB9 schema descriptors passed.',
          }
          changed = []
          for path in sorted(Path('tests').glob('*.test.js')):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Updated files:')
          print('\n'.join(changed) if changed else '(none)')
          PY
          git rm .github/workflows/pl31-db9-reconcile.yml
          git diff --check
          git diff -- tests .github/workflows/pl31-db9-reconcile.yml
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "PL31: reconcile historical DB9 test expectations"
          git push origin HEAD:pl31-custom-text
