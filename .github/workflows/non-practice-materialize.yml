name: Materialize non-Practice regression fixes
on:
  push:
    branches: [fix/non-practice-regression-sweep]
    paths: [.github/workflows/non-practice-materialize.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/non-practice-regression-sweep
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply confirmed non-Practice source repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              assert old in s, f'missing expected source in {path}'
              p.write_text(s.replace(old,new,1))
          replace('index.html', 'Campaign, Typing Test, Endless, Daily Strike, statistics', 'Campaign, Typing Test, Endless, Arcade Rush, statistics')
          replace('index.html', 'Play Campaign, Typing Test, Endless, and Daily Strike.', 'Play Campaign, Typing Test, Endless, and Arcade Rush.')
          replace('manifest.webmanifest', 'speed tests, daily challenges, statistics', 'speed tests, Arcade Rush, statistics')
          replace('js/mobileInputAdapter.js', '.speed-test-screen, .game-screen, .boss-screen, .endless-screen, .daily-screen', '.speed-test-screen, .game-screen, .boss-screen, .endless-screen, .arcade-rush-gameplay')
          replace('js/mobileInputAdapter.js', '#play-area, .speed-test-stage, .boss-arena', '#play-area, .speed-test-stage, .boss-arena, .arcade-rush-word-layer')
          replace('js/ui.js', '["daily", "DAILY STRIKE GUIDE"]', '["arcade-rush", "ARCADE RUSH GUIDE"]')
          replace('js/onboardingContent.js', '  endless: 1,\n  boss: 1,', '  endless: 1,\n  "arcade-rush": 1,\n  boss: 1,')
          replace('js/onboardingContent.js', '  boss: Object.freeze({\n    id: "boss", version: 1, title: "BOSS GUIDE",', '  "arcade-rush": Object.freeze({\n    id: "arcade-rush", version: 1, title: "ARCADE RUSH GUIDE",\n    steps: Object.freeze([\n      step("SIX WAVES. ONE FINAL BOSS.", "Race through six escalating waves while protecting five Core Integrity. Each cleared wave moves you closer to Core Breaker.", "difficulty-growth"),\n      step("BUILD SCORE UNDER PRESSURE", "Type incoming words before they reach the Core. Accuracy, combo, perfect waves, remaining integrity, and the final boss all contribute to your score.", "approaching-word"),\n      step("DEFEAT CORE BREAKER", "After wave six, complete the boss phrase sequences before the Core falls. Finish the run to post your best Arcade Rush score.", "boss-phrase", "START ARCADE RUSH"),\n    ]),\n  }),\n  boss: Object.freeze({\n    id: "boss", version: 1, title: "BOSS GUIDE",')
          replace('js/arcadeRush/arcadeRushUi.js', '.arcade-rush-word-layer{position:absolute;inset:0;z-index:2;pointer-events:none}', '.arcade-rush-word-layer{position:absolute;inset:0;z-index:2;pointer-events:auto}')
          replace('style.css', 'body.gameplay-active :is(.game-screen, .boss-screen, .speed-test-screen) {', 'body.gameplay-active :is(.game-screen, .boss-screen, .speed-test-screen, .arcade-rush-gameplay) {')
          replace('style.css', 'body.gameplay-viewport-short .hud,\nbody.gameplay-viewport-short .daily-hud,\nbody.gameplay-viewport-short .endless-hud,', 'body.gameplay-viewport-short .hud,\nbody.gameplay-viewport-short .endless-hud,')
          replace('style.css', 'body.gameplay-viewport-short .daily-screen,\nbody.gameplay-viewport-short .endless-screen,', 'body.gameplay-viewport-short .endless-screen,')
          replace('style.css', 'body.gameplay-viewport-short .daily-hud {\n  grid-template-columns: auto repeat(4, minmax(0, 1fr));\n  gap: 4px;\n  font-size: 9px;\n}\n\n', '')
          replace('tests/keyboardNavigation.test.js', 'getLeaderboardKeyboardTarget({ selectedBoardKey: LEADERBOARD_BOARDS.DAILY }, "Home")', 'getLeaderboardKeyboardTarget({ selectedBoardKey: "daily-strike-v1" }, "Home")')
          replace('tests/browser/non_practice_regressions.py', "  localStorage.setItem('wordstrike_save', JSON.stringify({", "  if (!localStorage.getItem('wordstrike_save')) localStorage.setItem('wordstrike_save', JSON.stringify({")
          replace('tests/browser/non_practice_regressions.py', '    page.locator("textarea.gameplay-input").dispatch_event("beforeinput", {"inputType": "insertText", "data": "a"})', '    page.locator("textarea.gameplay-input").evaluate("(el, data) => el.dispatchEvent(new InputEvent(\\\"beforeinput\\\", {bubbles:true,cancelable:true,inputType:\\\"insertText\\\",data}))", "a")')
          replace('tests/browser/non_practice_regressions.py', '    page.locator("textarea.gameplay-input").dispatch_event("beforeinput", {"inputType": "insertText", "data": text[0]})', '    page.locator("textarea.gameplay-input").evaluate("(el, data) => el.dispatchEvent(new InputEvent(\\\"beforeinput\\\", {bubbles:true,cancelable:true,inputType:\\\"insertText\\\",data}))", text[0])')
          PY
      - name: Run every non-Practice Node regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          tests=[p for p in sorted(Path('tests').glob('*.test.js')) if not p.name.startswith('practice-')]
          print(f'Running {len(tests)} non-Practice tests')
          for test in tests: subprocess.run(['node',str(test)],check=True)
          PY
      - name: Install browser engines
        run: |
          pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium firefox
      - name: Run cross-mode browser regressions
        run: python tests/browser/non_practice_regressions.py
      - name: Commit verified source repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest style.css js/mobileInputAdapter.js js/ui.js js/onboardingContent.js js/arcadeRush/arcadeRushUi.js tests/keyboardNavigation.test.js tests/browser/non_practice_regressions.py
          git diff --cached --check
          git commit -m 'Fix active non-Practice regressions and Arcade Rush mobile input'
          git push origin HEAD:fix/non-practice-regression-sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: non-practice-materialization-evidence
          path: browser-artifacts/non-practice/
          retention-days: 7
