name: PL5 Final Audit

on:
  push:
    branches: [codex/pl5-context-identity]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/pl5-context-identity
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate patch script
        run: node --check scripts/applyPL5FinalAudit.mjs

      - name: Apply PL5 final audit patch
        run: node scripts/applyPL5FinalAudit.mjs

      - name: Focused PL5 tests
        run: |
          node tests/practice-context-identity.test.js
          node tests/practice-context-migration-hardening.test.js
          node tests/practice-context-import-safety.test.js
          node tests/practice-database-v2-upgrade.test.js

      - name: Full WordStrike test suite
        run: npm test

      - name: Commit hardened implementation
        run: |
          rm scripts/applyPL5FinalAudit.mjs .github/workflows/pl5-final-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(practice): harden PL5 context migration contracts"
          git push origin HEAD:codex/pl5-context-identity
