name: PL5 Apply

on:
  push:
    branches: [codex/pl5-context-identity]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/pl5-context-identity
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply staging-script fix
        run: |
          node scripts/fixPL5Script.mjs
          node --check scripts/applyPL5.mjs

      - name: Apply PL5 patch
        run: node scripts/applyPL5.mjs

      - name: Focused PL5 tests
        run: |
          node tests/practice-context-identity.test.js
          node tests/practice-database-v2-upgrade.test.js

      - name: Full WordStrike test suite
        run: npm test

      - name: Commit implementation
        run: |
          rm scripts/applyPL5.mjs scripts/fixPL5Script.mjs .github/workflows/pl5-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(practice): implement PL5 context identity migration"
          git push origin HEAD:codex/pl5-context-identity
