name: PL14 documentation integration gate

on:
  push:
    branches:
      - codex/pl14-performance-state-frontier
    paths:
      - scripts/pl14_docs_apply.py
      - .github/workflows/pl14-docs-apply.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl14-performance-state-frontier
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply required PL14 documentation integrations
        run: python scripts/pl14_docs_apply.py
      - name: Normalize documentation EOF
        run: |
          python - <<'PY'
          from pathlib import Path
          for rel in [
              'docs/PRACTICE_LAB_DATA_ARCHITECTURE.md',
              'docs/PRACTICE_LAB_ABILITY_ESTIMATION.md',
              'docs/PRACTICE_LAB_SESSION_ENGINE.md',
          ]:
              path = Path(rel)
              path.write_text(path.read_text().rstrip() + '\n')
          PY
      - name: Verify documentation contracts
        run: |
          grep -q 'performanceStates' docs/PRACTICE_LAB_DATA_ARCHITECTURE.md
          grep -q 'latent ability is not current readiness' docs/PRACTICE_LAB_ABILITY_ESTIMATION.md
          grep -q 'performanceMeasurementKind' docs/PRACTICE_LAB_SESSION_ENGINE.md
          grep -q 'buildPerformanceMeasurement' docs/PRACTICE_LAB_SESSION_ENGINE.md
      - name: Run full regression suite
        run: npm test
      - name: Commit clean documentation integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(PL14): integrate performance state contracts"
          git push origin HEAD:codex/pl14-performance-state-frontier
