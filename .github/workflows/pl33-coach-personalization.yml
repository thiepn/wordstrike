name: PL33 Coach Personalization

on:
  push:
    branches: [pl33-coach-personalization]
  pull_request:
    paths:
      - 'js/practiceLab/**'
      - 'tests/practice-coach-personalization-*.test.js'
      - 'docs/practice-lab/PL33-COACH-PERSONALIZATION.md'
      - 'package.json'
      - '.github/workflows/pl33-coach-personalization.yml'

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run PL33 Coach Personalization certification
        run: node --test tests/practice-coach-personalization-*.test.js
      - name: Run full WordStrike regression suite
        run: npm test
