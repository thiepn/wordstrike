name: UI3 materialize
on:
  push:
    branches: [feat/ui3-mode-select]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui3-mode-select
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply UI3 migration
        run: python tools/apply_ui3.py
      - name: Run canonical tests
        run: npm test
      - name: Commit verified UI3 source migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui.js index.html style.css styles/ui-system.css
          git diff --cached --quiet && exit 0
          git commit -m "UI3: migrate Mode Select to challenge showcase"
          git push origin HEAD:feat/ui3-mode-select
