name: Typing repair workspace
on:
  push:
    branches: [fix/typing-test-desktop-regressions]
    paths: [.github/workflows/typing-repair-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > /tmp/wordstrike-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: wordstrike-repair-source
          path: /tmp/wordstrike-source.tar
          retention-days: 3
