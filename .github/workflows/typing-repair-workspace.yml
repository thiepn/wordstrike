name: Typing repair workspace
on:
  push:
    branches: [fix/typing-test-desktop-regressions]
    paths: [.github/workflows/typing-repair-workspace.yml]
permissions:
  contents: write
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typing-test-desktop-regressions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed repair patch
        run: |
          python - <<'PY'
          import base64, gzip, subprocess
          patch = gzip.decompress(base64.b64decode(''''''))
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
      - name: Run complete WordStrike regression suite
        run: npm test | tee /tmp/typing-node-tests.log
      - name: Install browser test dependencies
        run: |
          pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium firefox
      - name: Verify actual browser behavior
        run: python tests/browser/typing_regressions.py
      - name: Commit verified product repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Fix Typing Test desktop layout, command routing and presentation controls'
          git push origin HEAD:fix/typing-test-desktop-regressions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typing-repair-verification
          path: |
            browser-artifacts/
            /tmp/typing-node-tests.log
          retention-days: 7
