name: PL12 Doc Append

on:
  push:
    branches: [codex/pl12-limiter-impact-model]

permissions:
  contents: write

jobs:
  append-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pl12-limiter-impact-model
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Append PL12 downstream documentation
        run: |
          node --check scripts/applyPl12DocAppend.mjs
          node scripts/applyPl12DocAppend.mjs
          git diff --check
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRACTICE_LAB_SKILL_EVIDENCE_MODEL.md docs/PRACTICE_LAB_CONTEXT_TYPABILITY_MODEL.md
          git commit -m "docs(practice): add PL12 downstream contracts" || true
          git push origin HEAD:codex/pl12-limiter-impact-model
