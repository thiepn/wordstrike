    <script>
      (() => {
        // Diet Copilot and WORDSTRIKE share this Supabase project's Site URL.
        // WORDSTRIKE deliberately uses implicit OAuth, whose result is returned
        // in the URL fragment. Diet Copilot uses PKCE, whose result is returned
        // in the query string. Web callbacks go straight back to Diet so the
        // canonical Diet client that created the verifier performs the exchange.
        // Only an explicit native marker diverts the callback to Android.
        const TARGET_KEY = 'diet-copilot:oauth-target-v2';
        const FLOW_KEY = 'diet-copilot:oauth-flow-v2';
        const source = new URL(location.href);
        const value = key => source.searchParams.get(key);

        const hasPkceResult = Boolean(
          value('code') || value('error') || value('error_code') || value('error_description')
        );
        if (!hasPkceResult) return;

        let targetKind = null;
        let storedFlow = null;
        try {
          targetKind = sessionStorage.getItem(TARGET_KEY);
          storedFlow = sessionStorage.getItem(FLOW_KEY);
        } catch {}

        // Never claim an OAuth callback merely because it contains ?code= or
        // ?error=. WORDSTRIKE owns this root page too, and future/legacy auth
        // flows may legitimately return query parameters here. Diet Copilot
        // must explicitly mark the flow before leaving for the provider.
        if (targetKind !== 'web' && targetKind !== 'native') return;

        const target = new URL(
          targetKind === 'native' ? '/diet/native-auth-callback.html' : '/diet/',
          source.origin
        );

        for (const key of ['code', 'error', 'error_code', 'error_description']) {
          const current = value(key);
          if (current !== null) target.searchParams.set(key, current);
        }

        const flowId = value('sb_flow_id') || storedFlow;
        if (flowId) target.searchParams.set('sb_flow_id', flowId);

        try {
          sessionStorage.removeItem(TARGET_KEY);
          sessionStorage.removeItem(FLOW_KEY);
          history.replaceState(null, '', source.pathname);
        } catch {}

        location.replace(target.href);
      })();
    </script>
